<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F4F7F4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F1612" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="JulhaTasks">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="manifest" href="manifest.json">
<title>JulhaTasks</title>
<style>
:root{
  --bg:#F4F7F4; --surface:#FFFFFF; --surface2:#EDF4EF; --text:#1D2B23; --muted:#748178; --line:#E2E9E4;
  --green:#2F7D55; --green-soft:#DDEFE4; --green-ink:#1F5C3D; --danger:#C2554F;
  --shadow:0 1px 2px rgba(20,40,30,.05),0 6px 20px rgba(20,40,30,.06);
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0F1612;--surface:#17211B;--surface2:#1D2A22;--text:#E6EEE8;--muted:#8F9C94;--line:#26332B;
    --green:#4FB37F;--green-soft:#1E3A2B;--green-ink:#A3E0BD;--danger:#E07A73;--shadow:none}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased}
body{min-height:100vh;padding-bottom:calc(84px + env(safe-area-inset-bottom))}
body.lock{overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
input,textarea,select{font:inherit;font-size:16px;color:var(--text)}

header{position:sticky;top:0;z-index:5;background:var(--bg);
  padding:calc(env(safe-area-inset-top) + 14px) 20px 10px;display:flex;align-items:center;justify-content:space-between;
  max-width:560px;margin:0 auto}
.brand h1{margin:0;font-size:28px;letter-spacing:-.03em;font-weight:750}
.brand h1 span{color:var(--green)}
.brand p{margin:2px 0 0;color:var(--muted);font-size:14px}
.icon-btn{width:40px;height:40px;border-radius:50%;border:none;background:var(--surface);box-shadow:var(--shadow);
  display:grid;place-items:center;color:var(--muted);flex:none}
.icon-btn svg{width:20px;height:20px}

main{padding:6px 16px 24px;max-width:560px;margin:0 auto}
.card{background:var(--surface);border-radius:20px;box-shadow:var(--shadow);padding:14px}
.section-title{display:flex;align-items:baseline;justify-content:space-between;margin:22px 4px 8px;
  font-size:13px;font-weight:650;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.section-title small{text-transform:none;letter-spacing:0;font-weight:500}
.hint{color:var(--muted);font-size:13px;margin:-4px 4px 8px}
.empty{text-align:center;color:var(--muted);font-size:15px;padding:26px 12px}
.empty b{display:block;font-size:28px;margin-bottom:6px}

/* calendário */
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.cal-head h2{margin:0;font-size:18px;font-weight:650;text-transform:capitalize}
.cal-nav{display:flex;gap:6px}
.cal-nav button{border:none;background:var(--surface2);border-radius:12px;height:34px;min-width:34px;padding:0 10px;font-size:14px;font-weight:600}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
.cal-wd{font-size:12px;color:var(--muted);font-weight:600;padding:4px 0 6px}
.day{border:none;background:none;border-radius:12px;height:46px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:0}
.day span{font-size:15px;width:30px;height:30px;line-height:30px;border-radius:50%}
.day b{display:flex;gap:2px;height:5px}
.day b i{width:5px;height:5px;border-radius:50%;display:block}
.day.today span{color:var(--green);font-weight:750}
.day.sel span{background:var(--green);color:#fff;font-weight:650}

/* itens */
.list{display:flex;flex-direction:column}
.item{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:none}
.check{flex:none;width:26px;height:26px;border-radius:50%;border:2px solid #B9C6BE;background:none;padding:0;position:relative;transition:all .15s}
.done .check{background:var(--green);border-color:var(--green)}
.done .check::after{content:"";position:absolute;left:8px;top:3px;width:6px;height:12px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(45deg)}
.item-body{flex:1;min-width:0;cursor:pointer}
.item-title{font-size:16px;line-height:1.3;display:flex;align-items:center;gap:8px}
.item-title .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dot{flex:none;width:8px;height:8px;border-radius:50%}
.item-sub{font-size:13px;color:var(--muted);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.done .item-title .t{text-decoration:line-through;color:var(--muted)}
.pill{flex:none;font-size:12px;font-weight:650;color:var(--green-ink);background:var(--green-soft);padding:4px 9px;border-radius:999px}
.star{flex:none;border:none;background:none;font-size:20px;padding:4px;color:#C7D0CA;line-height:1}
.star.on{color:#E2A93B}

/* destaque */
[hidden]{display:none!important}
.amt{flex:none;text-align:right;font-weight:700;font-size:15px;font-variant-numeric:tabular-nums}
.amt small{display:block;font-size:11px;font-weight:600;color:var(--muted)}
.amt small.late{color:var(--danger)}
.done .amt{color:var(--muted)}
.item[data-bid] .item-sub{white-space:normal;line-height:1.35}
.fin-split{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.fin-split div{background:var(--bg);border-radius:14px;padding:10px 12px}
.fin-split small{display:block;font-size:12px;color:var(--muted);font-weight:600}
.fin-split b{font-size:17px;font-variant-numeric:tabular-nums}
.cat-row b{font-variant-numeric:tabular-nums;font-size:13px}
.months6{display:flex;gap:8px;align-items:flex-end}
.mcol{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:5px;cursor:pointer;min-width:0}
.mcol i{display:block;width:100%;max-width:30px;background:var(--green-soft);border-radius:7px}
.mcol.on i{background:var(--green)}
.mcol em{font-style:normal;font-size:10px;color:var(--muted);white-space:nowrap}
.mcol small{font-size:12px;color:var(--muted);font-weight:600}
.mcol.on small{color:var(--green)}
.seg{display:flex;background:var(--bg);border-radius:14px;padding:4px;margin-bottom:16px}
.seg label{flex:1;position:relative}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg span{display:block;text-align:center;padding:9px 4px;border-radius:10px;font-size:14px;font-weight:600;color:var(--muted)}
.seg input:checked + span{background:var(--surface);color:var(--green-ink);box-shadow:var(--shadow)}
.fin-preview{margin:-6px 0 14px;font-size:14px;color:var(--green-ink);background:var(--green-soft);border-radius:12px;padding:10px 12px}
.love{background:var(--green-soft);border-radius:18px;padding:14px 16px;margin-bottom:14px}
.love p{margin:0;font-size:15px;line-height:1.45;color:var(--text)}
.love span{display:block;margin-top:6px;font-size:13px;font-weight:600;color:var(--green-ink)}
.love.special{background:var(--green);color:#fff;padding:18px;box-shadow:var(--shadow)}
.love.special h3{margin:0 0 6px;font-size:19px;letter-spacing:-.01em}
.love.special p{color:#fff;opacity:.95}
.love.special span{color:#fff;opacity:.85}
.love.special.big{background:linear-gradient(135deg,#5DBA8A,#24684A);padding:22px 18px;text-align:center}
.love.special.big h3{font-size:23px}
.hero{background:var(--green);color:#fff;border-radius:22px;padding:18px;box-shadow:var(--shadow)}
.hero small{opacity:.85;font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.hero h3{margin:6px 0 2px;font-size:21px;letter-spacing:-.01em}
.hero p{margin:0;opacity:.9;font-size:14px}
.hero .big{font-size:40px;font-weight:750;letter-spacing:-.03em;line-height:1;margin-top:14px}
.hero .big span{font-size:15px;font-weight:600;opacity:.9;letter-spacing:0}

/* tarefas */
.add-row{display:flex;gap:8px}
.add-row input{flex:1;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:12px 14px;outline:none}
.add-row input:focus{border-color:var(--green)}
.add-row button{border:none;background:var(--green);color:#fff;border-radius:14px;padding:0 16px;font-weight:650}
.link{border:none;background:none;color:var(--green);font-weight:600;font-size:13px;padding:0;text-transform:none;letter-spacing:0}

/* histórico */
.years{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:none}
.years::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-size:14px;font-weight:600}
.chip.on{background:var(--green);border-color:var(--green);color:#fff}
.stat-big{font-size:44px;font-weight:750;letter-spacing:-.03em;line-height:1}
.stat-big span{font-size:16px;font-weight:600;color:var(--muted);letter-spacing:0}
.bar{height:8px;border-radius:99px;background:var(--surface2);overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;background:var(--green);border-radius:99px}
.cat-row{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;font-size:14px;margin-top:10px}
.cat-row .bar{margin:0;height:6px}

/* abas */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);
  padding:6px 8px calc(6px + env(safe-area-inset-bottom));display:flex;justify-content:space-around}
.tab{border:none;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;color:var(--muted);padding:6px 2px;min-width:0;flex:1}
.tab svg{width:24px;height:24px}
.tab.on{color:var(--green)}
.fab{position:fixed;right:20px;bottom:calc(84px + env(safe-area-inset-bottom));z-index:6;width:58px;height:58px;border-radius:50%;
  border:none;background:var(--green);color:#fff;font-size:32px;line-height:1;box-shadow:0 8px 24px rgba(47,125,85,.35);display:grid;place-items:center}
.fab svg{width:26px;height:26px}

/* painel inferior */
.sheet{position:fixed;inset:0;z-index:20;pointer-events:none}
.sheet .backdrop{position:absolute;inset:0;background:rgba(10,20,15,.35);opacity:0;transition:opacity .2s}
.sheet .panel{position:absolute;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;background:var(--surface);border-radius:24px 24px 0 0;
  padding:10px 20px calc(20px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto;transform:translateY(100%);transition:transform .25s ease}
.sheet.open{pointer-events:auto}
.sheet.open .backdrop{opacity:1}
.sheet.open .panel{transform:none}
.grab{width:40px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 12px}
.sheet h2{margin:0 0 14px;font-size:20px}
.field{display:block;margin-bottom:14px;font-size:13px;font-weight:600;color:var(--muted)}
.field input,.field textarea{display:block;width:100%;margin-top:6px;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:11px 12px;outline:none;font-weight:400;-webkit-appearance:none;appearance:none;min-height:46px}
.field textarea{resize:vertical}
.field input:focus,.field textarea:focus{border-color:var(--green)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cats{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 14px}
.cats label{position:relative}
.cats input{position:absolute;opacity:0;pointer-events:none}
.cats span{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:8px 12px;font-size:14px;font-weight:500;color:var(--text);background:var(--bg)}
.cats input:checked + span{border-color:var(--green);background:var(--green-soft);color:var(--green-ink);font-weight:650}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;border-radius:14px;background:var(--bg);margin-bottom:14px}
.switch div{font-size:15px;font-weight:600}
.switch small{display:block;font-size:12px;font-weight:400;color:var(--muted);margin-top:2px}
.switch input{-webkit-appearance:none;appearance:none;flex:none;width:50px;height:30px;border-radius:99px;background:#C9D3CC;position:relative;transition:background .2s;margin:0}
.switch input::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:transform .2s}
.switch input:checked{background:var(--green)}
.switch input:checked::after{transform:translateX(20px)}
.actions{display:flex;gap:10px;margin-top:6px}
.btn{flex:1;border:none;border-radius:14px;padding:14px;font-weight:650;font-size:16px}
.btn.primary{background:var(--green);color:#fff}
.btn.ghost{background:var(--bg);color:var(--text)}
.btn.danger{color:var(--danger);flex:0 0 auto;padding:14px 18px}
.menu-btn{display:flex;align-items:center;gap:12px;width:100%;border:none;background:var(--bg);border-radius:14px;padding:14px;margin-bottom:10px;text-align:left;font-size:16px;font-weight:600}
.menu-btn small{display:block;font-weight:400;font-size:13px;color:var(--muted);margin-top:2px}
.about{font-size:14px;color:var(--muted);line-height:1.5}
.about ol{padding-left:20px;margin:6px 0}

.toast{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(10px);z-index:30;
  background:var(--text);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;font-weight:600;opacity:0;transition:all .2s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%)}
</style>
</head>
<body>

<header>
  <div class="brand">
    <h1>Julha<span>Tasks</span></h1>
    <p id="greeting"></p>
  </div>
  <button class="icon-btn" data-act="settings" aria-label="Ajustes">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/></svg>
  </button>
</header>

<main id="main"></main>

<button class="fab" id="fab" data-act="new-ev" aria-label="Novo evento">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
</button>

<nav class="tabs">
  <button class="tab" data-act="tab" data-tab="agenda">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4.5" width="18" height="16" rx="3"/><path d="M3 9.5h18M8 2.5v4M16 2.5v4"/></svg>Agenda</button>
  <button class="tab" data-act="tab" data-tab="proximos">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Próximos</button>
  <button class="tab" data-act="tab" data-tab="tarefas">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6h11M9 12h11M9 18h11"/><path d="M3.5 6l1.2 1.2L7 5M3.5 12l1.2 1.2L7 11M3.5 18l1.2 1.2L7 17"/></svg>Tarefas</button>
  <button class="tab" data-act="tab" data-tab="financas">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="5.5" width="19" height="13" rx="3"/><path d="M2.5 10h19M6.5 14.5h4"/></svg>Finanças</button>
  <button class="tab" data-act="tab" data-tab="historico">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Histórico</button>
</nav>

<div class="sheet" id="sheet">
  <div class="backdrop" data-act="close-sheet"></div>
  <div class="panel"><div class="grab"></div><div id="sheetBody"></div></div>
</div>
<div class="toast" id="toast"></div>
<input type="file" id="importFile" accept="application/json,.json" hidden>

<script>
/* ---------- dados ---------- */
const CATS = {
  aniversario:{label:'Aniversário', emoji:'🎂', color:'#D9A441'},
  passeio:    {label:'Passeio',     emoji:'💚', color:'#3E9B6B'},
  compromisso:{label:'Compromisso', emoji:'📌', color:'#4C7FB8'},
  saude:      {label:'Saúde',       emoji:'🩺', color:'#C9625C'},
  trabalho:   {label:'Trabalho',    emoji:'💼', color:'#8A72B8'},
  outro:      {label:'Outro',       emoji:'✨', color:'#8A958E'},
};
const KEY = 'julhatasks.v1';
const MONTHS = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const MONTHS_S = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
const WEEK = ['domingo','segunda-feira','terça-feira','quarta-feira','quinta-feira','sexta-feira','sábado'];

let state = load();
function load(){
  try{
    const s = JSON.parse(localStorage.getItem(KEY));
    if(s && Array.isArray(s.events)) return {events:s.events, tasks:Array.isArray(s.tasks)?s.tasks:[], bills:Array.isArray(s.bills)?s.bills:[]};
  }catch(e){}
  return {events:[], tasks:[], bills:[]};
}
function save(){
  try{ localStorage.setItem(KEY, JSON.stringify(state)); }
  catch(e){ toast('Não consegui salvar 😕'); }
}
try{ navigator.storage && navigator.storage.persist && navigator.storage.persist(); }catch(e){}

/* ---------- utilidades ---------- */
const $ = s => document.querySelector(s);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const pad = n => String(n).padStart(2,'0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y,m-1,d); };
const todayStr = () => ymd(new Date());
const dayDiff = (a,b) => Math.round((parse(b)-parse(a))/86400000);
const isLeap = y => (y%4===0 && y%100!==0) || y%400===0;
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const cat = ev => CATS[ev.cat] || CATS.outro;
const fmtShort = s => { const d = parse(s); return `${d.getDate()} ${MONTHS_S[d.getMonth()]}`; };
const fmtLong = s => { const d = parse(s); return `${WEEK[d.getDay()]}, ${d.getDate()} de ${MONTHS[d.getMonth()]}`; };
const countdown = n => n===0 ? 'hoje' : n===1 ? 'amanhã' : `em ${n} dias`;

/* Um evento "todo ano" gera uma ocorrência em cada ano a partir do ano em que foi criado */
function occFor(ev, year){
  const [y,m,d] = ev.date.split('-').map(Number);
  if(!ev.yearly) return y===year ? [{ev, date:ev.date, year, done:!!ev.done}] : [];
  if(year < y) return [];
  const dd = (m===2 && d===29 && !isLeap(year)) ? 28 : d;
  return [{ev, date:`${year}-${pad(m)}-${pad(dd)}`, year, done:(ev.doneYears||[]).includes(year)}];
}
const cmpOcc = (a,b) => a.date.localeCompare(b.date) || (a.ev.time||'99').localeCompare(b.ev.time||'99');
const occInYear = year => state.events.flatMap(e => occFor(e, year)).sort(cmpOcc);

/* ---------- estado da tela ---------- */
const now = new Date();
const ui = { tab:'agenda', y:now.getFullYear(), m:now.getMonth(), sel:todayStr(), hy:now.getFullYear(), showDone:false, fm:`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}` };
try{ const t = localStorage.getItem('julhatasks.tab'); if(t) ui.tab = t; }catch(e){}

/* ---------- linhas ---------- */
function occRow(o, opts={}){
  const c = cat(o.ev), sub = [];
  if(opts.showDate) sub.push(fmtShort(o.date));
  if(o.ev.time) sub.push(o.ev.time);
  if(o.ev.yearly) sub.push('todo ano');
  if(o.ev.note) sub.push(esc(o.ev.note));
  return `<div class="item ${o.done?'done':''}" data-id="${o.ev.id}" data-year="${o.year}">
    <button class="check" data-act="toggle-ev" aria-label="Marcar como feito"></button>
    <div class="item-body" data-act="edit-ev">
      <div class="item-title"><span class="dot" style="background:${c.color}"></span><span class="t">${esc(o.ev.title)}</span></div>
      <div class="item-sub">${c.emoji} ${sub.length ? sub.join(' · ') : c.label}</div>
    </div>
    ${opts.right || ''}
  </div>`;
}
function taskRow(t){
  return `<div class="item ${t.done?'done':''}" data-tid="${t.id}">
    <button class="check" data-act="toggle-task" aria-label="Concluir tarefa"></button>
    <div class="item-body" data-act="edit-task">
      <div class="item-title"><span class="t">${esc(t.title)}</span></div>
      ${t.note ? `<div class="item-sub">${esc(t.note)}</div>` : ''}
    </div>
    ${t.done ? '' : `<button class="star ${t.important?'on':''}" data-act="star-task" aria-label="Importante">★</button>`}

/* ---------- telas ---------- */
function renderAgenda(){
  const {y, m} = ui, t = todayStr();
  const byDay = {};
  occInYear(y).forEach(o => { if(+o.date.slice(5,7) === m+1) (byDay[o.date] ??= []).push(o); });
  const first = new Date(y,m,1).getDay(), days = new Date(y,m+1,0).getDate();
  let cells = ['D','S','T','Q','Q','S','S'].map(w => `<div class="cal-wd">${w}</div>`).join('');
  for(let i=0;i<first;i++) cells += '<div></div>';
  for(let d=1; d<=days; d++){
    const ds = `${y}-${pad(m+1)}-${pad(d)}`;
    const dots = (byDay[ds]||[]).slice(0,3).map(o => `<i style="background:${cat(o.ev).color};${o.done?'opacity:.35':''}"></i>`).join('');
    cells += `<button class="day ${ds===t?'today':''} ${ds===ui.sel?'sel':''}" data-act="pick" data-date="${ds}"><span>${d}</span><b>${dots}</b></button>`;
  }
  const selList = occInYear(+ui.sel.slice(0,4)).filter(o => o.date === ui.sel);
  return `
  <div class="card">
    <div class="cal-head">
      <h2>${MONTHS[m]} ${y}</h2>
      <div class="cal-nav">
        <button data-act="month" data-d="-1" aria-label="Mês anterior">‹</button>
        <button data-act="today">Hoje</button>
        <button data-act="month" data-d="1" aria-label="Próximo mês">›</button>
      </div>
    </div>
    <div class="cal-grid">${cells}</div>
  </div>
  <div class="section-title">${fmtLong(ui.sel)}${ui.sel===t?' <small>hoje</small>':''}</div>
  <div class="card">
    ${selList.length ? `<div class="list">${selList.map(o => occRow(o)).join('')}</div>`
      : `<div class="empty"><b>🌿</b>Nada marcado neste dia.<br>Toque no + para adicionar.</div>`}
  </div>`;
}

function renderUpcoming(){
  const t = todayStr(), y = new Date().getFullYear();
  const all = [...occInYear(y-1), ...occInYear(y), ...occInYear(y+1)];
  const pend = all.filter(o => o.date < t && !o.done && dayDiff(o.date, t) <= 60);
  const hoje = all.filter(o => o.date === t);
  const next = all.filter(o => o.date > t && dayDiff(t, o.date) <= 365);
  const feat = next.find(o => !o.done);
  let html = '';
  if(feat){
    const n = dayDiff(t, feat.date);
    html += `<div class="hero" data-id="${feat.ev.id}" data-year="${feat.year}" data-act="edit-ev">
      <small>Próximo evento</small>
      <h3>${cat(feat.ev).emoji} ${esc(feat.ev.title)}</h3>
      <p>${fmtLong(feat.date)}${feat.ev.time ? ' · '+feat.ev.time : ''}</p>
      <div class="big">${n===1 ? 'Amanhã' : n+' <span>dias</span>'}</div>
    </div>`;
  }
  if(pend.length){
    html += `<div class="section-title">Pendentes</div><p class="hint">Já passaram — marque o que você fez.</p>
      <div class="card"><div class="list">${pend.map(o => occRow(o,{showDate:true})).join('')}</div></div>`;
  }
  html += `<div class="section-title">Hoje</div><div class="card">${hoje.length
    ? `<div class="list">${hoje.map(o => occRow(o)).join('')}</div>`
    : `<div class="empty" style="padding:14px">Nada para hoje 🌱</div>`}</div>`;
  const groups = {};
  next.forEach(o => (groups[o.date.slice(0,7)] ??= []).push(o));
  Object.keys(groups).forEach(k => {
    const [gy, gm] = k.split('-').map(Number);
    html += `<div class="section-title">${MONTHS[gm-1]}${gy!==y?' '+gy:''}</div>
      <div class="card"><div class="list">${groups[k].map(o => occRow(o,{showDate:true, right:`<span class="pill">${countdown(dayDiff(t,o.date))}</span>`})).join('')}</div></div>`;
  });
  if(!next.length && !hoje.length && !pend.length)
    html += `<div class="card" style="margin-top:12px"><div class="empty"><b>📅</b>Nenhum evento pela frente.<br>Toque no + para criar o primeiro.</div></div>`;
  return html;
}

function renderTasks(){
  const pending = state.tasks.filter(t => !t.done).sort((a,b) => (b.important?1:0)-(a.important?1:0) || a.created - b.created);
  const done = state.tasks.filter(t => t.done).sort((a,b) => (b.doneAt||0)-(a.doneAt||0));
  return `
  <form class="add-row" id="taskForm" autocomplete="off">
    <input name="title" placeholder="Nova tarefa…" maxlength="140" enterkeyhint="done">
    <button type="submit">Adicionar</button>
  </form>
  <div class="section-title">A fazer <small>${pending.length}</small></div>
  <div class="card">${pending.length
    ? `<div class="list">${pending.map(taskRow).join('')}</div>`
    : `<div class="empty"><b>✅</b>Tudo em dia!</div>`}</div>
  ${done.length ? `
  <div class="section-title">Concluídas <small>${done.length}</small>
    <span><button class="link" data-act="toggle-done-list">${ui.showDone?'Ocultar':'Mostrar'}</button>
    ${ui.showDone ? ` · <button class="link" data-act="clear-done">Limpar</button>` : ''}</span></div>
  ${ui.showDone ? `<div class="card"><div class="list">${done.map(taskRow).join('')}</div></div>` : ''}` : ''}`;
}

function renderHistory(){
  const cy = new Date().getFullYear();
  const years = new Set([cy]);
  state.events.forEach(e => {
    const y0 = +e.date.slice(0,4);
    if(e.yearly){ for(let y=y0; y<=cy; y++) years.add(y); } else years.add(y0);
  });
  const ylist = [...years].sort((a,b) => b-a);
  const occ = occInYear(ui.hy);
  const t = todayStr();
  const relevant = occ.filter(o => o.date <= t || o.done);
  const done = occ.filter(o => o.done);
  const pct = relevant.length ? Math.round(done.length / relevant.length * 100) : 0;
  const byCat = {};
  done.forEach(o => byCat[o.ev.cat] = (byCat[o.ev.cat]||0) + 1);
  const max = Math.max(1, ...Object.values(byCat));
  const catRows = Object.keys(CATS).filter(k => byCat[k]).map(k =>
    `<div class="cat-row"><span>${CATS[k].emoji} ${CATS[k].label}</span><div class="bar"><i style="width:${byCat[k]/max*100}%;background:${CATS[k].color}"></i></div><b>${byCat[k]}</b></div>`).join('');
  const months = {};
  occ.forEach(o => (months[+o.date.slice(5,7)] ??= []).push(o));
  return `
  <div class="years">${ylist.map(y => `<button class="chip ${y===ui.hy?'on':''}" data-act="year" data-y="${y}">${y}</button>`).join('')}</div>
  <div class="card" style="margin-top:8px">
    <div style="font-size:14px;color:var(--muted);font-weight:600;margin-bottom:8px">Retrospectiva ${ui.hy}</div>
    <div class="stat-big">${done.length} <span>evento${done.length===1?'':'s'} concluído${done.length===1?'':'s'}</span></div>
    ${relevant.length ? `<div class="bar"><i style="width:${pct}%"></i></div>
      <div style="font-size:13px;color:var(--muted);margin-top:6px">${pct}% do que já passou foi marcado como feito</div>` : ''}
    ${catRows}
  </div>
  ${Object.keys(months).length ? Object.keys(months).sort((a,b) => a-b).map(mm => `
    <div class="section-title">${MONTHS[mm-1]} <small>${months[mm].filter(o => o.done).length}/${months[mm].length}</small></div>
    <div class="card"><div class="list">${months[mm].map(o => occRow(o,{showDate:true})).join('')}</div></div>`).join('')
  : `<div class="card" style="margin-top:12px"><div class="empty"><b>📖</b>Nenhum evento em ${ui.hy}.</div></div>`}`;
}

/* ---------- finanças ---------- */
const PAYS = {
  credito: {label:'Cartão de crédito', emoji:'💳'},
  debito:  {label:'Débito',  emoji:'🏧'},
  pix:     {label:'Pix',     emoji:'⚡'},
  boleto:  {label:'Boleto',  emoji:'🧾'},
  dinheiro:{label:'Dinheiro',emoji:'💵'},
};
const FCATS = {
  casa:      {label:'Casa',       emoji:'🏠', color:'#4C7FB8'},
  mercado:   {label:'Mercado',    emoji:'🛒', color:'#3E9B6B'},
  compras:   {label:'Compras',    emoji:'🛍️', color:'#D9A441'},
  lazer:     {label:'Lazer',      emoji:'🎉', color:'#8A72B8'},
  saude:     {label:'Saúde',      emoji:'🩺', color:'#C9625C'},
  transporte:{label:'Transporte', emoji:'🚗', color:'#5A9AA8'},
  outros:    {label:'Outros',     emoji:'✨', color:'#8A958E'},
};
const BTYPES = {parcela:'Parcelado', fixa:'Conta fixa', avulso:'Gasto avulso'};
const BRL = new Intl.NumberFormat('pt-BR', {style:'currency', currency:'BRL'});
const money = v => BRL.format(v || 0);
function parseMoney(s){
  s = String(s).trim().replace(/[R$\s]/g, '');
  if(s.includes(',')) s = s.replace(/\./g, '').replace(',', '.');
  else if(/^\d{1,3}(\.\d{3})+$/.test(s)) s = s.replace(/\./g, '');
  const v = parseFloat(s);
  return isFinite(v) ? Math.round(v * 100) / 100 : NaN;
}
const ymAdd = (s, k) => { const [y,m] = s.split('-').map(Number); const d = new Date(y, m-1+k, 1); return `${d.getFullYear()}-${pad(d.getMonth()+1)}`; };
const ymDiff = (a, b) => { const [ay,am] = a.split('-').map(Number), [by,bm] = b.split('-').map(Number); return (by-ay)*12 + (bm-am); };
const fmtYM = s => { const [y,m] = s.split('-').map(Number); return `${MONTHS[m-1]} ${y}`; };
const curYM = () => todayStr().slice(0,7);

/* parcelado: N meses a partir do primeiro; conta fixa: todo mês até "parar"; avulso: só no mês escolhido */
function billOcc(b, M){
  const i = ymDiff(b.start, M);
  if(i < 0) return null;
  if(b.type === 'parcela' && i >= b.n) return null;
  if(b.type === 'avulso' && i !== 0) return null;
  if(b.type === 'fixa' && b.end && M > b.end) return null;
  return {b, month:M, k:i+1, paid:(b.paid||[]).includes(M)};
}
const billsInMonth = M => state.bills.map(b => billOcc(b, M)).filter(Boolean)
  .sort((x,y) => (x.b.day||32) - (y.b.day||32) || x.b.title.localeCompare(y.b.title));
const sumOf = list => Math.round(list.reduce((s,o) => s + (+o.b.amount || 0), 0) * 100) / 100;

function billRow(o){
  const b = o.b, c = FCATS[b.cat] || FCATS.outros, p = PAYS[b.pay], sub = [];
  if(b.type === 'parcela') sub.push(`Parcela ${o.k}/${b.n}`);
  else if(b.type === 'fixa') sub.push('Todo mês');
  if(b.who) sub.push(esc(b.who));
  if(b.day) sub.push(`vence dia ${b.day}`);
  if(p) sub.push(`${p.emoji} ${p.label}`);
  const cm = curYM(), late = !o.paid && (o.month < cm || (o.month === cm && b.day && b.day < new Date().getDate()));
  return `<div class="item ${o.paid?'done':''}" data-bid="${b.id}" data-month="${o.month}">
    <button class="check" data-act="toggle-bill" aria-label="Marcar como pago"></button>
    <div class="item-body" data-act="edit-bill">
      <div class="item-title"><span class="dot" style="background:${c.color}"></span><span class="t">${esc(b.title)}</span></div>
      <div class="item-sub">${c.emoji} ${sub.join(' · ')}</div>
    </div>
    <div class="amt">${money(b.amount)}${late ? '<small class="late">atrasada</small>' : ''}</div>
  </div>`;
}

function renderFinance(){
  const M = ui.fm, list = billsInMonth(M);
  const total = sumOf(list), paid = sumOf(list.filter(o => o.paid)), left = Math.round((total - paid) * 100) / 100;
  const pct = total ? Math.round(paid / total * 100) : 0;
  const group = (key, dict) => {
    const g = {};
    list.forEach(o => { const k = dict[o.b[key]] ? o.b[key] : Object.keys(dict).pop(); g[k] = (g[k]||0) + (+o.b.amount||0); });
    const max = Math.max(1, ...Object.values(g));
    return Object.keys(dict).filter(k => g[k]).sort((a,b) => g[b]-g[a]).map(k =>
      `<div class="cat-row"><span>${dict[k].emoji} ${dict[k].label}</span><div class="bar"><i style="width:${g[k]/max*100}%;${dict[k].color?'background:'+dict[k].color:''}"></i></div><b>${money(g[k])}</b></div>`).join('');
  };
  const last6 = [-5,-4,-3,-2,-1,0].map(k => { const m = ymAdd(M, k); return {m, v:sumOf(billsInMonth(m))}; });
  const max6 = Math.max(1, ...last6.map(x => x.v));
  const plans = state.bills.filter(b => b.type === 'parcela').map(b => {
    const paidN = (b.paid||[]).filter(m => { const i = ymDiff(b.start, m); return i >= 0 && i < b.n; }).length;
    return {b, paidN};
  }).filter(x => x.paidN < x.b.n);
  return `
  <div class="card">
    <div class="cal-head">
      <h2>${fmtYM(M)}</h2>
      <div class="cal-nav">
        <button data-act="fmonth" data-d="-1" aria-label="Mês anterior">‹</button>
        <button data-act="fmonth" data-d="0">Hoje</button>
        <button data-act="fmonth" data-d="1" aria-label="Próximo mês">›</button>
      </div>
    </div>
    <div style="font-size:13px;color:var(--muted);font-weight:600">Total do mês</div>
    <div class="stat-big" style="margin-top:4px">${money(total)}</div>
    <div class="bar"><i style="width:${pct}%"></i></div>
    <div class="fin-split">
      <div><small>Pago</small><b>${money(paid)}</b></div>
      <div><small>Falta pagar</small><b style="${left>0?'color:var(--danger)':''}">${money(left)}</b></div>
    </div>
  </div>
  <div class="section-title">Contas de ${MONTHS[+M.slice(5)-1]} <small>${list.filter(o=>o.paid).length}/${list.length} pagas</small></div>
  <div class="card">${list.length
    ? `<div class="list">${list.map(billRow).join('')}</div>`
    : `<div class="empty"><b>💸</b>Nada lançado neste mês.<br>Toque no + para adicionar.</div>`}</div>
  ${list.length ? `
  <div class="section-title">Resumo do mês</div>
  <div class="card">
    <div style="font-size:13px;color:var(--muted);font-weight:600">Por forma de pagamento</div>${group('pay', PAYS)}
    <div style="font-size:13px;color:var(--muted);font-weight:600;margin-top:18px">Por categoria</div>${group('cat', FCATS)}
  </div>` : ''}
  <div class="section-title">Últimos 6 meses</div>
  <div class="card"><div class="months6">${last6.map(x => `
    <div class="mcol ${x.m===M?'on':''}" data-act="fgo" data-m="${x.m}">
      <em>${x.v ? money(x.v).replace(/,\d\d$/,'') : ''}</em>
      <i style="height:${Math.max(3, x.v/max6*80)}px"></i>
      <small>${MONTHS_S[+x.m.slice(5)-1]}</small>
    </div>`).join('')}</div></div>
  ${plans.length ? `
  <div class="section-title">Parcelas em andamento</div>
  <div class="card"><div class="list">${plans.map(({b, paidN}) => `
    <div class="item" data-bid="${b.id}">
      <div class="item-body" data-act="edit-bill">
        <div class="item-title"><span class="t">${esc(b.title)}</span></div>
        <div class="item-sub">${paidN} de ${b.n} pagas · falta ${money((b.n-paidN)*b.amount)}${b.who?' · '+esc(b.who):''}</div>
        <div class="bar" style="height:6px;margin-top:8px"><i style="width:${paidN/b.n*100}%"></i></div>
      </div>
      <div class="amt">${money(b.amount)}<small>/mês</small></div>
    </div>`).join('')}</div></div>` : ''}`;
}

function billForm(b){
  const isNew = !b;
  b = b || {type:'parcela', title:'', who:'', amount:'', n:3, start:ui.fm, day:'', pay:'credito', cat:'compras', note:''};
  const chips = (name, dict, val) => Object.entries(dict).map(([k,c]) =>
    `<label><input type="radio" name="${name}" value="${k}" ${val===k?'checked':''}><span>${c.emoji} ${c.label}</span></label>`).join('');
  const amt = b.amount === '' ? '' : String(b.amount).replace('.', ',');
  return `<form id="billForm" data-id="${isNew?'':b.id}" autocomplete="off">
    <h2>${isNew ? 'Novo lançamento' : 'Editar lançamento'}</h2>
    <div class="seg">${Object.entries(BTYPES).map(([k,l]) =>
      `<label><input type="radio" name="type" value="${k}" ${b.type===k?'checked':''}><span>${l}</span></label>`).join('')}</div>
    <label class="field">Descrição<input name="title" required maxlength="100" value="${esc(b.title)}" placeholder="Ex.: Celular novo"></label>
    <div class="row2">
      <label class="field"><span data-lbl-amount>Valor</span><input name="amount" required inputmode="decimal" value="${amt}" placeholder="R$ 0,00"></label>
      <label class="field" data-only="parcela">Nº de parcelas<input name="n" type="number" inputmode="numeric" min="1" max="120" value="${b.n||3}"></label>
    </div>
    <div class="fin-preview" data-only="parcela" id="billTotal"></div>
    <label class="field">Para quem / onde<input name="who" maxlength="80" value="${esc(b.who||'')}" placeholder="Ex.: Nubank, Magalu, Ana…"></label>
    <div class="row2">
      <label class="field"><span data-lbl-start>Primeiro mês</span><input name="start" type="month" required value="${b.start}"></label>
      <label class="field">Dia do vencimento<input name="day" type="number" inputmode="numeric" min="1" max="31" value="${b.day||''}" placeholder="Opcional"></label>
    </div>
    <div class="field" style="margin-bottom:0">Forma de pagamento</div>
    <div class="cats">${chips('pay', PAYS, b.pay)}</div>
    <div class="field" style="margin-bottom:0">Categoria</div>
    <div class="cats">${chips('cat', FCATS, b.cat)}</div>
    <label class="field">Observação<textarea name="note" rows="2" maxlength="300" placeholder="Opcional">${esc(b.note||'')}</textarea></label>
    ${!isNew && b.type === 'fixa' ? `<button type="button" class="menu-btn" data-act="stop-bill" style="justify-content:center">⏹️ ${b.end ? `Termina em ${fmtYM(b.end)} · voltar a repetir` : `Parar de repetir depois de ${fmtYM(ui.fm)}`}</button>` : ''}
    <div class="actions">
      ${isNew ? `<button type="button" class="btn ghost" data-act="close-sheet">Cancelar</button>` : `<button type="button" class="btn ghost danger" data-act="delete-bill">Excluir</button>`}
      <button type="submit" class="btn primary">Salvar</button>
    </div>
  </form>`;
}
function syncBillForm(f){
  if(!f) return;
  const t = f.elements.type.value;
  f.querySelectorAll('[data-only]').forEach(el => el.hidden = el.dataset.only !== t);
  f.querySelector('[data-lbl-amount]').textContent = t === 'parcela' ? 'Valor da parcela' : 'Valor';
  f.querySelector('[data-lbl-start]').textContent = t === 'avulso' ? 'Mês' : 'Primeiro mês';
  if(t === 'parcela'){
    const v = parseMoney(f.elements.amount.value), n = parseInt(f.elements.n.value, 10);
    const start = f.elements.start.value;
    $('#billTotal').innerHTML = (v > 0 && n > 0)
      ? `${n}× de ${money(v)} = <b>${money(v*n)}</b>${start && n > 1 ? ` · até ${fmtYM(ymAdd(start, n-1))}` : ''}`
      : 'Preencha o valor e o número de parcelas';
  }
}
const findBill = el => { const it = el.closest('[data-bid]'); return it && {b: state.bills.find(x => x.id === it.dataset.bid), month: it.dataset.month}; };

document.addEventListener('input', e => { const f = e.target.form; if(f && f.id === 'billForm') syncBillForm(f); });
document.addEventListener('change', e => { const f = e.target.form; if(f && f.id === 'billForm') syncBillForm(f); });

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if(!el) return;
  switch(el.dataset.act){
    case 'fmonth': ui.fm = +el.dataset.d ? ymAdd(ui.fm, +el.dataset.d) : curYM(); render(); break;
    case 'fgo': ui.fm = el.dataset.m; render(); break;
    case 'toggle-bill': {
      const f = findBill(el); if(!f || !f.b) break;
      const s = new Set(f.b.paid || []), nowPaid = !s.has(f.month);
      nowPaid ? s.add(f.month) : s.delete(f.month); f.b.paid = [...s];
      save(); render(); if(nowPaid) toast('Pago! 💚'); break; }
    case 'edit-bill': { const f = findBill(el); if(f && f.b){ openSheet(billForm(f.b)); syncBillForm($('#billForm')); } break; }
    case 'delete-bill': {
      const id = $('#billForm').dataset.id;
      if(confirm('Excluir este lançamento? Ele some de todos os meses.')){ state.bills = state.bills.filter(b => b.id !== id); save(); closeSheet(); render(); }
      break; }
    case 'stop-bill': {
      const b = state.bills.find(x => x.id === $('#billForm').dataset.id); if(!b) break;
      if(b.end){ delete b.end; toast('Voltou a repetir todo mês'); }
      else { b.end = ui.fm < b.start ? b.start : ui.fm; toast(`Termina em ${fmtYM(b.end)}`); }
      save(); closeSheet(); render(); break; }
  }
});

document.addEventListener('submit', e => {
  const f = e.target; if(f.id !== 'billForm') return;
  e.preventDefault();
  const el = f.elements, type = el.type.value;
  const amount = parseMoney(el.amount.value);
  if(!(amount > 0)){ toast('Valor inválido'); return; }
  const n = type === 'parcela' ? Math.min(120, Math.max(1, parseInt(el.n.value, 10) || 1)) : 1;
  const day = parseInt(el.day.value, 10);
  const data = {
    type, title: el.title.value.trim(), who: el.who.value.trim(), amount, n,
    start: el.start.value || ui.fm, day: day >= 1 && day <= 31 ? day : '',
    pay: (f.querySelector('input[name=pay]:checked') || {}).value || 'pix',
    cat: (f.querySelector('input[name=cat]:checked') || {}).value || 'outros',
    note: el.note.value.trim(),
  };
  if(!data.title) return;
  const id = f.dataset.id;
  if(id){ const b = state.bills.find(x => x.id === id); if(b){ if(type !== 'fixa') delete b.end; Object.assign(b, data); } }
  else state.bills.push({id:uid(), ...data, paid:[], created:Date.now()});
  if(!id) ui.fm = data.start;
  save(); closeSheet(); render(); toast(id ? 'Lançamento atualizado' : 'Lançamento criado 💚');
});

/* ---------- saudação e mensagem do dia (horário de Brasília) ---------- */
function brNow(){
  try{
    const p = Object.fromEntries(new Intl.DateTimeFormat('en-CA', {timeZone:'America/Sao_Paulo', year:'numeric', month:'2-digit', day:'2-digit', hour:'2-digit', hourCycle:'h23'})
      .formatToParts(new Date()).map(x => [x.type, x.value]));
    return {hour:+p.hour, date:`${p.year}-${p.month}-${p.day}`};
  }catch(e){ const d = new Date(); return {hour:d.getHours(), date:ymd(d)}; }
}
function greeting(h){
  if(h >= 5 && h < 12) return 'Bom dia';
  if(h >= 12 && h < 18) return 'Boa tarde';
  return 'Boa noite';
}

const MSG_A = ['Oi, amor!','Ei, linda!','Oi, minha vida!','Oi, meu bem!','Ei, princesa!','Oi, minha linda!','Amor!','Oi, meu amor!','Ei, você!','Oi, gatinha!'];
const MSG_B = [
  'Só passando pra lembrar que eu te amo muito.',
  'Você é a melhor parte dos meus dias.',
  'Tenho muito orgulho de você.',
  'Que hoje seja leve e cheio de coisas boas pra você.',
  'Você deixa tudo mais bonito.',
  'Mal posso esperar pra te ver.',
  'Obrigado por existir na minha vida.',
  'Você é a pessoa mais especial do mundo pra mim.',
  'Cada dia ao seu lado é um presente.',
  'Lembra que você é incrível, tá?',
  'Seu sorriso é a minha coisa favorita.',
  'Eu escolheria você de novo, todos os dias.',
  'Você consegue tudo o que quiser.',
  'Tô pensando em você agora.',
  'Que sorte a minha ter você.',
  'Você é o meu lugar favorito.',
  'Com você tudo fica mais fácil.',
  'Você é linda por dentro e por fora.',
  'Meu coração é todinho seu.',
  'Não importa o dia, eu tô sempre do seu lado.',
];
const MSG_C = ['Te amo! 💚','Te amo muito! 💚','Beijo grande! 😘','Te amo infinito. 💚','Sempre com você. 💚','Um beijo do seu amor. 😘','Te amo mais que tudo. 💚','Fica bem, tá? 💚'];
function dailyMessage(dateStr){
  // a mesma data sempre gera a mesma mensagem; muda a cada dia
  let s = 0; for(const ch of dateStr) s = (Math.imul(s, 31) + ch.charCodeAt(0)) | 0;
  const rnd = () => { s = (s + 0x6D2B79F5) | 0; let t = Math.imul(s ^ (s >>> 15), 1 | s); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  const pick = arr => arr[Math.floor(rnd() * arr.length)];
  return `${pick(MSG_A)} ${pick(MSG_B)} ${pick(MSG_C)}`;
}

/* ---------- namoro: começou em 11/12/2022; todo dia 11 é especial ---------- */
const START = {y:2022, m:12, d:11};
const MONTHLY_LINES = [
  'Obrigado por cada dia ao seu lado.',
  'Cada mês com você é melhor que o anterior.',
  'Que venham muitos e muitos meses juntos.',
  'Você é a melhor coisa que me aconteceu.',
  'Eu te escolho de novo, todo mês.',
  'Amo a nossa história.',
];
function togetherText(months){
  const y = Math.floor(months / 12), m = months % 12, parts = [];
  if(y) parts.push(`${y} ano${y>1?'s':''}`);
  if(m) parts.push(`${m} ${m>1?'meses':'mês'}`);
  return parts.join(' e ');
}
function specialDay(dateStr){
  const [y, m, d] = dateStr.split('-').map(Number);
  if(d !== START.d) return null;
  const months = (y - START.y) * 12 + (m - START.m);
  if(months <= 0) return null;
  const line = MONTHLY_LINES[months % MONTHLY_LINES.length];
  if(months % 12 === 0) return {
    big: true,
    title: `Feliz ${months/12} ano${months>12?'s':''} de namoro! 🎉`,
    text: `Hoje fazemos ${togetherText(months)} juntos, meu amor. Obrigado por cada dia, cada risada e cada momento. Te amo infinito. 💚`,
  };
  return {
    title: 'Feliz mêsversário, amor! 💚',
    text: `Hoje fazemos ${togetherText(months)} de namoro. ${line} Te amo!`,
  };
}

function render(){
  const br = brNow();
  $('#greeting').textContent = `${greeting(br.hour)}, Julha 💚`;
  const views = {agenda:renderAgenda, proximos:renderUpcoming, tarefas:renderTasks, financas:renderFinance, historico:renderHistory};
  if(!views[ui.tab]) ui.tab = 'agenda';
  const sp = specialDay(br.date);
  const love = sp
    ? `<div class="love special ${sp.big?'big':''}"><h3>${esc(sp.title)}</h3><p>${esc(sp.text)}</p><span>— do seu namorado, Lucas</span></div>`
    : `<div class="love"><p>${esc(dailyMessage(br.date))}</p><span>— do seu namorado, Lucas</span></div>`;
  $('#main').innerHTML = love + views[ui.tab]();
  document.querySelectorAll('.tab').forEach(b => b.classList.toggle('on', b.dataset.tab === ui.tab));
  $('#fab').style.display = ui.tab === 'tarefas' ? 'none' : '';
}

/* ---------- painel inferior ---------- */
function openSheet(html){
  $('#sheetBody').innerHTML = html;
  $('#sheet').classList.add('open');
  document.body.classList.add('lock');
}
function closeSheet(){
  $('#sheet').classList.remove('open');
  document.body.classList.remove('lock');
}

function eventForm(ev){
  const isNew = !ev;
  ev = ev || {title:'', date: ui.tab==='agenda' ? ui.sel : todayStr(), time:'', cat:'compromisso', yearly:false, note:''};
  return `<form id="evForm" data-id="${isNew?'':ev.id}" autocomplete="off">
    <h2>${isNew ? 'Novo evento' : 'Editar evento'}</h2>
    <label class="field">O que é<input name="title" required maxlength="120" value="${esc(ev.title)}" placeholder="Ex.: Aniversário da Ana"></label>
    <div class="row2">
      <label class="field">Data<input type="date" name="date" required value="${ev.date}"></label>
      <label class="field">Horário (opcional)<input type="time" name="time" value="${ev.time||''}"></label>
    </div>
    <div class="field" style="margin-bottom:0">Categoria</div>
    <div class="cats">${Object.entries(CATS).map(([k,c]) =>
      `<label><input type="radio" name="cat" value="${k}" ${ev.cat===k?'checked':''}><span>${c.emoji} ${c.label}</span></label>`).join('')}</div>
    <label class="switch"><div>Repetir todo ano<small>Ótimo para aniversários e datas especiais</small></div>
      <input type="checkbox" name="yearly" ${ev.yearly?'checked':''}></label>
    <label class="field">Observação<textarea name="note" rows="2" maxlength="300" placeholder="Opcional">${esc(ev.note||'')}</textarea></label>
    <div class="actions">
      ${isNew ? `<button type="button" class="btn ghost" data-act="close-sheet">Cancelar</button>` : `<button type="button" class="btn ghost danger" data-act="delete-ev">Excluir</button>`}
      <button type="submit" class="btn primary">Salvar</button>
    </div>
  </form>`;
}

function taskForm(t){
  return `<form id="taskEdit" data-tid="${t.id}" autocomplete="off">
    <h2>Editar tarefa</h2>
    <label class="field">Tarefa<input name="title" required maxlength="140" value="${esc(t.title)}"></label>
    <label class="field">Detalhes<textarea name="note" rows="3" maxlength="500" placeholder="Opcional">${esc(t.note||'')}</textarea></label>
    <label class="switch"><div>Importante<small>Fica no topo da lista</small></div><input type="checkbox" name="important" ${t.important?'checked':''}></label>
    <div class="actions">
      <button type="button" class="btn ghost danger" data-act="delete-task">Excluir</button>
      <button type="submit" class="btn primary">Salvar</button>
    </div>
  </form>`;
}

function settingsSheet(){
  const nEv = state.events.length, nT = state.tasks.length, nB = state.bills.length;
  return `<h2>Ajustes</h2>
    <button class="menu-btn" data-act="export">💾<div>Fazer backup<small>Salva um arquivo com tudo (${nEv} eventos, ${nT} tarefas, ${nB} lançamentos)</small></div></button>
    <button class="menu-btn" data-act="import">📥<div>Restaurar backup<small>Carrega um arquivo de backup salvo antes</small></div></button>
    <div class="about">
      <b>Dica:</b> faça um backup de vez em quando e guarde no iCloud Drive (app Arquivos). Assim nada se perde se você trocar de celular.
      <p style="margin-top:12px"><b>Instalar no iPhone</b></p>
      <ol><li>Abra este link no <b>Safari</b></li><li>Toque em <b>Compartilhar</b> (quadrado com seta)</li><li>Escolha <b>Adicionar à Tela de Início</b></li></ol>
      <p style="text-align:center;margin-top:16px">Feito com 💚 para a Julha</p>
    </div>`;
}

/* ---------- backup ---------- */
async function exportData(){
  const json = JSON.stringify({app:'JulhaTasks', exportedAt:new Date().toISOString(), events:state.events, tasks:state.tasks, bills:state.bills}, null, 2);
  const name = `julhatasks-backup-${todayStr()}.json`;
  const file = new File([json], name, {type:'application/json'});
  if(navigator.canShare && navigator.canShare({files:[file]})){
    try{ await navigator.share({files:[file], title:name}); return; }
    catch(e){ if(e.name === 'AbortError') return; }
  }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(file); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
$('#importFile').addEventListener('change', async e => {
  const f = e.target.files[0]; e.target.value = '';
  if(!f) return;
  try{
    const data = JSON.parse(await f.text());
    if(!Array.isArray(data.events)) throw new Error('formato');
    if(!confirm(`Restaurar backup com ${data.events.length} eventos e ${(data.tasks||[]).length} tarefas e ${(data.bills||[]).length} lançamentos? Os dados atuais serão substituídos.`)) return;
    state = {events:data.events, tasks:Array.isArray(data.tasks) ? data.tasks : [], bills:Array.isArray(data.bills) ? data.bills : []};
    save(); closeSheet(); render(); toast('Backup restaurado 💚');
  }catch(err){ toast('Arquivo de backup inválido'); }
});

let toastTimer;
function toast(msg){
  const el = $('#toast'); el.textContent = msg; el.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove('show'), 2200);
}

/* ---------- interações ---------- */
const findEv = el => { const it = el.closest('[data-id]'); return it && {ev: state.events.find(e => e.id === it.dataset.id), year: +it.dataset.year}; };
const findTask = el => { const it = el.closest('[data-tid]'); return it && state.tasks.find(t => t.id === it.dataset.tid); };

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if(!el) return;
  const act = el.dataset.act;
  switch(act){
    case 'tab':
      ui.tab = el.dataset.tab; try{ localStorage.setItem('julhatasks.tab', ui.tab); }catch(_){}
      render(); window.scrollTo(0,0); break;
    case 'month': {
      const d = new Date(ui.y, ui.m + (+el.dataset.d), 1); ui.y = d.getFullYear(); ui.m = d.getMonth(); render(); break; }
    case 'today': { const n = new Date(); ui.y = n.getFullYear(); ui.m = n.getMonth(); ui.sel = todayStr(); render(); break; }
    case 'pick': ui.sel = el.dataset.date; render(); break;
    case 'year': ui.hy = +el.dataset.y; render(); break;
    case 'new-ev': openSheet(ui.tab === 'financas' ? billForm(null) : eventForm(null)); if(ui.tab === 'financas') syncBillForm($('#billForm')); break;
    case 'edit-ev': { const f = findEv(el); if(f && f.ev) openSheet(eventForm(f.ev)); break; }
    case 'toggle-ev': {
      const f = findEv(el); if(!f || !f.ev) break;
      let nowDone;
      if(f.ev.yearly){
        const s = new Set(f.ev.doneYears || []);
        nowDone = !s.has(f.year); nowDone ? s.add(f.year) : s.delete(f.year);
        f.ev.doneYears = [...s];
      } else { f.ev.done = nowDone = !f.ev.done; }
      save(); render(); if(nowDone) toast('Feito! 💚'); break; }
    case 'delete-ev': {
      const id = $('#evForm').dataset.id;
      if(confirm('Excluir este evento?' + (state.events.find(e => e.id===id)?.yearly ? ' (Ele some de todos os anos.)' : ''))){
        state.events = state.events.filter(e => e.id !== id); save(); closeSheet(); render(); }
      break; }
    case 'toggle-task': { const t = findTask(el); if(t){ t.done = !t.done; t.doneAt = t.done ? Date.now() : null; save(); render(); if(t.done) toast('Tarefa concluída ✅'); } break; }
    case 'star-task': { const t = findTask(el); if(t){ t.important = !t.important; save(); render(); } break; }
    case 'edit-task': { const t = findTask(el); if(t) openSheet(taskForm(t)); break; }
    case 'delete-task': {
      const id = $('#taskEdit').dataset.tid;
      if(confirm('Excluir esta tarefa?')){ state.tasks = state.tasks.filter(t => t.id !== id); save(); closeSheet(); render(); }
      break; }
    case 'toggle-done-list': ui.showDone = !ui.showDone; render(); break;
    case 'clear-done':
      if(confirm('Apagar todas as tarefas concluídas?')){ state.tasks = state.tasks.filter(t => !t.done); save(); render(); }
      break;
    case 'settings': openSheet(settingsSheet()); break;
    case 'export': exportData(); break;
    case 'import': $('#importFile').click(); break;
    case 'close-sheet': closeSheet(); break;
  }
});

document.addEventListener('change', e => {
  // ao escolher "Aniversário" num evento novo, já liga o "todo ano"
  const f = e.target.form;
  if(f && f.id === 'evForm' && e.target.name === 'cat' && e.target.value === 'aniversario' && !f.dataset.id) f.elements.yearly.checked = true;
});

document.addEventListener('submit', e => {
  const f = e.target; e.preventDefault();
  if(f.id === 'taskForm'){
    const title = f.elements.title.value.trim(); if(!title) return;
    state.tasks.push({id:uid(), title, note:'', important:false, done:false, created:Date.now()});
    save(); render(); const inp = $('#taskForm input'); inp && inp.focus();
  }
  if(f.id === 'taskEdit'){
    const t = state.tasks.find(x => x.id === f.dataset.tid); if(!t) return;
    t.title = f.elements.title.value.trim() || t.title; t.note = f.elements.note.value.trim(); t.important = f.elements.important.checked;
    save(); closeSheet(); render();
  }
  if(f.id === 'evForm'){
    const data = {
      title: f.elements.title.value.trim(), date: f.elements.date.value, time: f.elements.time.value,
      cat: (f.querySelector('input[name=cat]:checked') || {}).value || 'outro',
      yearly: f.elements.yearly.checked, note: f.elements.note.value.trim(),
    };
    if(!data.title || !data.date) return;
    const id = f.dataset.id;
    if(id){
      const ev = state.events.find(e => e.id === id);
      if(ev){
        if(ev.yearly && !data.yearly){ ev.done = (ev.doneYears||[]).includes(+data.date.slice(0,4)); }
        if(!ev.yearly && data.yearly){ ev.doneYears = ev.done ? [+ev.date.slice(0,4)] : []; }
        Object.assign(ev, data);
      }
    } else {
      state.events.push({id:uid(), ...data, done:false, doneYears:[], created:Date.now()});
    }
    // leva a agenda para o dia do evento
    const d = parse(data.date); ui.sel = data.date; ui.y = d.getFullYear(); ui.m = d.getMonth();
    save(); closeSheet(); render(); toast(id ? 'Evento atualizado' : 'Evento criado 💚');
  }
});

render();

if('serviceWorker' in navigator && location.protocol.startsWith('http')){
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
