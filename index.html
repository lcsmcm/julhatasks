<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F4F7F4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F1612" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="JujuTasks">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="manifest" href="manifest.json">
<title>JujuTasks</title>
<style>
:root{
  --bg:#F4F7F4; --surface:#FFFFFF; --surface2:#EDF4EF; --text:#1D2B23; --muted:#748178; --line:#E2E9E4;
  --green:#2F7D55; --green-soft:#DDEFE4; --green-ink:#1F5C3D; --danger:#C2554F;
  --shadow:0 1px 2px rgba(20,40,30,.05),0 6px 20px rgba(20,40,30,.06);
  --fab-shadow:rgba(47,125,85,.35); --grad1:#5DBA8A; --grad2:#24684A;
  --period:#E05A7A; --period-soft:#FCE4EA; --fertile:#3A9CBE; --fertile-soft:#DCF0F7; --fertile-ink:#1F6E8A;
  color-scheme:light dark;
}
:root[data-mode=light]{color-scheme:light}
@media (prefers-color-scheme:dark){
  :root:not([data-mode=light]){--bg:#0F1612;--surface:#17211B;--surface2:#1D2A22;--text:#E6EEE8;--muted:#8F9C94;--line:#26332B;
    --green:#4FB37F;--green-soft:#1E3A2B;--green-ink:#A3E0BD;--danger:#E07A73;--shadow:none;
    --period:#F0728F;--period-soft:#4A2230;--fertile:#5BB8D8;--fertile-soft:#173A47;--fertile-ink:#A6DDF0}
}
:root[data-mode=dark]{color-scheme:dark;--bg:#0F1612;--surface:#17211B;--surface2:#1D2A22;--text:#E6EEE8;--muted:#8F9C94;--line:#26332B;
  --green:#4FB37F;--green-soft:#1E3A2B;--green-ink:#A3E0BD;--danger:#E07A73;--shadow:none;
  --period:#F0728F;--period-soft:#4A2230;--fertile:#5BB8D8;--fertile-soft:#173A47;--fertile-ink:#A6DDF0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased}
body{min-height:100vh;padding-bottom:calc(84px + env(safe-area-inset-bottom))}
body.lock{overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
input,textarea,select{font:inherit;font-size:16px;color:var(--text)}

header{position:sticky;top:0;z-index:5;background:var(--bg);
  padding:calc(env(safe-area-inset-top) + 14px) 20px 10px;display:flex;align-items:center;justify-content:space-between;
  max-width:560px;margin:0 auto}
.brand h1{margin:0;font-size:28px;letter-spacing:-.03em;font-weight:750}
.brand h1 span{color:var(--green)}
.brand p{margin:2px 0 0;color:var(--muted);font-size:14px}
.icon-btn{width:40px;height:40px;border-radius:50%;border:none;background:var(--surface);box-shadow:var(--shadow);
  display:grid;place-items:center;color:var(--muted);flex:none}
.icon-btn svg{width:20px;height:20px}

main{padding:6px 16px 24px;max-width:560px;margin:0 auto}
.card{background:var(--surface);border-radius:20px;box-shadow:var(--shadow);padding:14px}
.section-title{display:flex;align-items:baseline;justify-content:space-between;margin:22px 4px 8px;
  font-size:13px;font-weight:650;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.section-title small{text-transform:none;letter-spacing:0;font-weight:500}
.hint{color:var(--muted);font-size:13px;margin:-4px 4px 8px}
.empty{text-align:center;color:var(--muted);font-size:15px;padding:26px 12px}
.empty b{display:block;font-size:28px;margin-bottom:6px}

/* calendário */
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.cal-head h2{margin:0;font-size:18px;font-weight:650;text-transform:capitalize}
.cal-nav{display:flex;gap:6px}
.cal-nav button{border:none;background:var(--surface2);border-radius:12px;height:34px;min-width:34px;padding:0 10px;font-size:14px;font-weight:600}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
.cal-wd{font-size:12px;color:var(--muted);font-weight:600;padding:4px 0 6px}
.day{border:none;background:none;border-radius:12px;height:46px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:0}
.day span{font-size:15px;width:30px;height:30px;line-height:30px;border-radius:50%}
.day b{display:flex;gap:2px;height:5px}
.day b i{width:5px;height:5px;border-radius:50%;display:block}
.day.today span{color:var(--green);font-weight:750}
.day.sel span{background:var(--green);color:#fff;font-weight:650}

/* itens */
.list{display:flex;flex-direction:column}
.item{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:none}
.check{flex:none;width:26px;height:26px;border-radius:50%;border:2px solid #B9C6BE;background:none;padding:0;position:relative;transition:all .15s}
.done .check{background:var(--green);border-color:var(--green)}
.done .check::after{content:"";position:absolute;left:8px;top:3px;width:6px;height:12px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(45deg)}
.item-body{flex:1;min-width:0;cursor:pointer}
.item-title{font-size:16px;line-height:1.3;display:flex;align-items:center;gap:8px}
.item-title .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dot{flex:none;width:8px;height:8px;border-radius:50%}
.item-sub{font-size:13px;color:var(--muted);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.done .item-title .t{text-decoration:line-through;color:var(--muted)}
.pill{flex:none;font-size:12px;font-weight:650;color:var(--green-ink);background:var(--green-soft);padding:4px 9px;border-radius:999px}
.star{flex:none;border:none;background:none;font-size:20px;padding:4px;color:#C7D0CA;line-height:1}
.star.on{color:#E2A93B}

/* destaque */
[hidden]{display:none!important}
.amt{flex:none;text-align:right;font-weight:700;font-size:15px;font-variant-numeric:tabular-nums}
.amt small{display:block;font-size:11px;font-weight:600;color:var(--muted)}
.amt small.late{color:var(--danger)}
.done .amt{color:var(--muted)}
.item[data-bid] .item-sub{white-space:normal;line-height:1.35}
.fin-split{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.fin-split div{background:var(--bg);border-radius:14px;padding:10px 12px}
.fin-split small{display:block;font-size:12px;color:var(--muted);font-weight:600}
.fin-split b{font-size:17px;font-variant-numeric:tabular-nums}
.cat-row b{font-variant-numeric:tabular-nums;font-size:13px}
.months6{display:flex;gap:8px;align-items:flex-end}
.mcol{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:5px;cursor:pointer;min-width:0}
.mcol i{display:block;width:100%;max-width:30px;background:var(--green-soft);border-radius:7px}
.mcol.on i{background:var(--green)}
.mcol em{font-style:normal;font-size:10px;color:var(--muted);white-space:nowrap}
.mcol small{font-size:12px;color:var(--muted);font-weight:600}
.mcol.on small{color:var(--green)}
.seg{display:flex;background:var(--bg);border-radius:14px;padding:4px;margin-bottom:16px}
.seg label{flex:1;position:relative}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg span{display:block;text-align:center;padding:9px 4px;border-radius:10px;font-size:14px;font-weight:600;color:var(--muted)}
.seg input:checked + span{background:var(--surface);color:var(--green-ink);box-shadow:var(--shadow)}
.fin-preview{margin:-6px 0 14px;font-size:14px;color:var(--green-ink);background:var(--green-soft);border-radius:12px;padding:10px 12px}
.love{background:var(--green-soft);border-radius:18px;padding:14px 16px;margin-bottom:14px}
.love p{margin:0;font-size:15px;line-height:1.45;color:var(--text)}
.love span{display:block;margin-top:6px;font-size:13px;font-weight:600;color:var(--green-ink)}
.love.special{background:var(--green);color:#fff;padding:18px;box-shadow:var(--shadow)}
.love.special h3{margin:0 0 6px;font-size:19px;letter-spacing:-.01em}
.love.special p{color:#fff;opacity:.95}
.love.special span{color:#fff;opacity:.85}
.love.special.big{background:linear-gradient(135deg,var(--grad1),var(--grad2));padding:22px 18px;text-align:center}
.love.special.big h3{font-size:23px}
.hero{background:var(--green);color:#fff;border-radius:22px;padding:18px;box-shadow:var(--shadow)}
.hero small{opacity:.85;font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.hero h3{margin:6px 0 2px;font-size:21px;letter-spacing:-.01em}
.hero p{margin:0;opacity:.9;font-size:14px}
.hero .big{font-size:40px;font-weight:750;letter-spacing:-.03em;line-height:1;margin-top:14px}
.hero .big span{font-size:15px;font-weight:600;opacity:.9;letter-spacing:0}

/* tarefas */
.add-row{display:flex;gap:8px}
.add-row input{flex:1;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:12px 14px;outline:none}
.add-row input:focus{border-color:var(--green)}
.add-row button{border:none;background:var(--green);color:#fff;border-radius:14px;padding:0 16px;font-weight:650}
.link{border:none;background:none;color:var(--green);font-weight:600;font-size:13px;padding:0;text-transform:none;letter-spacing:0}

/* histórico */
.years{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:none}
.years::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-size:14px;font-weight:600}
.chip.on{background:var(--green);border-color:var(--green);color:#fff}
.stat-big{font-size:44px;font-weight:750;letter-spacing:-.03em;line-height:1}
.stat-big span{font-size:16px;font-weight:600;color:var(--muted);letter-spacing:0}
.bar{height:8px;border-radius:99px;background:var(--surface2);overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;background:var(--green);border-radius:99px}
.cat-row{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;font-size:14px;margin-top:10px}
.cat-row .bar{margin:0;height:6px}

/* saúde */
.cycle-hero{text-align:center;padding:20px 16px}
.cycle-hero h3{margin:0;font-size:21px;letter-spacing:-.01em}
.cycle-hero p{margin:4px 0 0;color:var(--muted);font-size:14px;line-height:1.4}
.ring{position:relative;width:150px;height:150px;margin:0 auto 14px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .c small{font-size:12px;color:var(--muted);font-weight:600}
.ring .c b{font-size:46px;font-weight:750;letter-spacing:-.03em;line-height:1.05}
.phase{display:inline-block;margin-top:10px;font-size:12px;font-weight:650;padding:5px 11px;border-radius:99px;background:var(--surface2);color:var(--text)}
.phase.menstrual{background:var(--period-soft);color:var(--period)}
.phase.fertil,.phase.ovulacao{background:var(--fertile-soft);color:var(--fertile-ink)}
.hbtns{display:flex;gap:8px;margin-top:16px}
.hbtns .btn{padding:12px 8px;font-size:15px}
.btn.period{background:var(--period);color:#fff}
.tip{background:var(--surface2);border-radius:16px;padding:12px 14px;margin-top:12px;font-size:14px;line-height:1.45}
.hday.fert span{background:var(--fertile-soft);color:var(--fertile-ink)}
.hday.ovu span{background:var(--fertile);color:#fff;font-weight:650}
.hday.pred span{border:2px dashed var(--period);line-height:26px;color:var(--period)}
.hday.per span{background:var(--period);color:#fff;font-weight:650}
.hday.today span{text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:2px}
.hcal.editing .hday:not(.per) span{border:1.5px solid var(--line);line-height:27px}
.hcal.editing .hday.future{opacity:.35}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted);margin-top:10px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stats3 div{background:var(--bg);border-radius:14px;padding:10px 6px;text-align:center}
.stats3 b{display:block;font-size:24px;font-weight:750;letter-spacing:-.02em}
.stats3 small{font-size:11px;color:var(--muted);font-weight:600}
.period-seg input:checked + span{background:var(--period);color:#fff}
.period-seg input[value="0"]:checked + span{background:var(--surface);color:var(--text)}
.day b.hb{display:block;height:9px;font-size:12px;line-height:9px;color:var(--period);font-weight:700}
body.lock2{overflow:hidden}
.fullcal{position:fixed;inset:0;z-index:15;background:var(--bg);display:flex;flex-direction:column}
.fc-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:calc(env(safe-area-inset-top) + 10px) 16px 8px;max-width:560px;width:100%;margin:0 auto}
.fc-head b{font-size:17px}
.fc-wd{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;font-size:12px;font-weight:650;color:var(--muted);padding:6px 16px 8px;border-bottom:1px solid var(--line);max-width:560px;width:100%;margin:0 auto}
.fc-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 16px 24px;max-width:560px;width:100%;margin:0 auto;position:relative}
.fc-month h3{margin:20px 4px 8px;font-size:18px;text-transform:capitalize}
.fc-body .day{height:54px}
.fc-body .day span{font-size:16px}
.fc-foot{padding:12px 16px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--surface)}
.fc-foot .in{max-width:560px;margin:0 auto}
.water{display:flex;align-items:center;gap:14px}
.wbtn{flex:none;width:46px;height:46px;border-radius:50%;border:none;background:var(--surface2);font-size:26px;line-height:1;font-weight:500;display:grid;place-items:center;padding:0}
.wbtn.plus{background:var(--fertile);color:#fff}
.wbtn:disabled{opacity:.4}
.wmid{flex:1;min-width:0}
.wmid b{font-size:26px;font-weight:750;letter-spacing:-.02em}
.wmid span{color:var(--muted);font-weight:600}
.wmid .bar{margin-top:8px}
/* categorias e aparência */
.cat-emoji{flex:none;width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-size:19px}
.chev{flex:none;color:var(--muted);font-size:22px;line-height:1}
.swatches{display:flex;flex-wrap:wrap;gap:10px 6px;margin:8px 0 18px}
.sw{border:none;background:none;padding:0;display:flex;flex-direction:column;align-items:center;gap:5px;font-size:11px;font-weight:600;color:var(--muted);width:60px;position:relative}
.sw input{position:absolute;opacity:0;pointer-events:none}
.sw i{width:40px;height:40px;border-radius:50%;display:block}
.sw.on i,.sw input:checked + i{box-shadow:0 0 0 3px var(--surface),0 0 0 5px var(--text)}
.swatches.small .sw{width:auto}
.swatches.small .sw i{width:32px;height:32px}
.emoji-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;margin:-6px 0 14px}
.emoji-grid button{border:none;background:var(--bg);border-radius:10px;font-size:20px;height:38px;padding:0}
.chip-add{border:1.5px dashed var(--line);background:none;border-radius:999px;padding:7px 12px;font-size:14px;font-weight:650;color:var(--green)}
.cat-preview{display:flex;justify-content:center;margin:0 0 16px}
.cat-preview span{border-radius:999px;padding:8px 16px;font-size:16px;font-weight:650}

/* abas */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);
  padding:6px 4px calc(6px + env(safe-area-inset-bottom));display:flex;justify-content:space-around}
.tab{border:none;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;letter-spacing:-.01em;font-weight:600;color:var(--muted);padding:6px 2px;min-width:0;flex:1}
.tab svg{width:23px;height:23px}
.tab.on{color:var(--green)}
.fab{position:fixed;right:20px;bottom:calc(84px + env(safe-area-inset-bottom));z-index:6;width:58px;height:58px;border-radius:50%;
  border:none;background:var(--green);color:#fff;font-size:32px;line-height:1;box-shadow:0 8px 24px var(--fab-shadow);display:grid;place-items:center}
.fab svg{width:26px;height:26px}

/* painel inferior */
.sheet{position:fixed;inset:0;z-index:20;pointer-events:none}
.sheet .backdrop{position:absolute;inset:0;background:rgba(10,20,15,.35);opacity:0;transition:opacity .2s}
.sheet .panel{position:absolute;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;background:var(--surface);border-radius:24px 24px 0 0;
  padding:10px 20px calc(20px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto;transform:translateY(100%);transition:transform .25s ease}
.sheet.open{pointer-events:auto}
.sheet.open .backdrop{opacity:1}
.sheet.open .panel{transform:none}
.grab{width:40px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 12px}
.sheet h2{margin:0 0 14px;font-size:20px}
.field{display:block;margin-bottom:14px;font-size:13px;font-weight:600;color:var(--muted)}
.field input,.field textarea{display:block;width:100%;margin-top:6px;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:11px 12px;outline:none;font-weight:400;-webkit-appearance:none;appearance:none;min-height:46px}
.field textarea{resize:vertical}
.field input:focus,.field textarea:focus{border-color:var(--green)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cats{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 14px}
.cats label{position:relative}
.cats input{position:absolute;opacity:0;pointer-events:none}
.cats span{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:8px 12px;font-size:14px;font-weight:500;color:var(--text);background:var(--bg)}
.cats input:checked + span{border-color:var(--green);background:var(--green-soft);color:var(--green-ink);font-weight:650}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;border-radius:14px;background:var(--bg);margin-bottom:14px}
.switch div{font-size:15px;font-weight:600}
.switch small{display:block;font-size:12px;font-weight:400;color:var(--muted);margin-top:2px}
.switch input{-webkit-appearance:none;appearance:none;flex:none;width:50px;height:30px;border-radius:99px;background:#C9D3CC;position:relative;transition:background .2s;margin:0}
.switch input::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:transform .2s}
.switch input:checked{background:var(--green)}
.switch input:checked::after{transform:translateX(20px)}
.actions{display:flex;gap:10px;margin-top:6px}
.btn{flex:1;border:none;border-radius:14px;padding:14px;font-weight:650;font-size:16px}
.btn.primary{background:var(--green);color:#fff}
.btn.ghost{background:var(--bg);color:var(--text)}
.btn.danger{color:var(--danger);flex:0 0 auto;padding:14px 18px}
.menu-btn{display:flex;align-items:center;gap:12px;width:100%;border:none;background:var(--bg);border-radius:14px;padding:14px;margin-bottom:10px;text-align:left;font-size:16px;font-weight:600}
.menu-btn small{display:block;font-weight:400;font-size:13px;color:var(--muted);margin-top:2px}
.about{font-size:14px;color:var(--muted);line-height:1.5}
.about ol{padding-left:20px;margin:6px 0}

.toast{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(10px);z-index:30;
  background:var(--text);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;font-weight:600;opacity:0;transition:all .2s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%)}
</style>
<style id="themeVars"></style>
<script>
/* temas de cor: cada um gera as cores do modo claro e do escuro a partir de um tom */
const THEMES = {
  verde:   {n:'Verde',    h:149, s:45, sw:'#2F7D55'},
  rosa:    {n:'Rosa',     h:335, s:55},
  lilas:   {n:'Lilás',    h:268, s:38},
  azul:    {n:'Azul',     h:212, s:52},
  turquesa:{n:'Turquesa', h:184, s:60},
  coral:   {n:'Coral',    h:8,   s:62},
  vinho:   {n:'Vinho',    h:345, s:52},
  dourado: {n:'Dourado',  h:36,  s:62},
  grafite: {n:'Grafite',  h:215, s:10},
};
THEMES.rosa.sw = 'hsl(335,55%,46%)';
Object.values(THEMES).forEach(t => { if(!t.sw) t.sw = `hsl(${t.h},${t.s}%,42%)`; });
function themeCSS(k){
  const t = THEMES[k]; if(!t || k === 'verde') return '';
  const {h, s} = t, soft = Math.min(55, s + 8), tint = Math.min(26, s * .5);
  const light = `--bg:hsl(${h},${tint}%,96.5%);--surface2:hsl(${h},${tint+6}%,94%);--line:hsl(${h},${tint}%,90%);--text:hsl(${h},20%,14%);--muted:hsl(${h},7%,47%);
    --green:hsl(${h},${s}%,${k==='dourado'?36:42}%);--green-soft:hsl(${h},${soft}%,91%);--green-ink:hsl(${h},${s}%,26%);
    --fab-shadow:hsla(${h},${s}%,42%,.35);--grad1:hsl(${h},${s*.8}%,60%);--grad2:hsl(${h},${s}%,30%)`;
  const dark = `--bg:hsl(${h},${tint*.7}%,7%);--surface:hsl(${h},${tint*.6}%,11%);--surface2:hsl(${h},${tint*.6}%,14%);--line:hsl(${h},${tint*.5}%,19%);
    --text:hsl(${h},15%,92%);--muted:hsl(${h},7%,61%);--green:hsl(${h},${Math.min(60,s+5)}%,60%);--green-soft:hsl(${h},${Math.min(40,s)}%,19%);--green-ink:hsl(${h},${Math.min(60,s+10)}%,80%)`;
  return `:root{${light}}\n@media (prefers-color-scheme:dark){:root:not([data-mode=light]){${dark}}}\n:root[data-mode=dark]{${dark}}`;
}
function applyTheme(th){
  th = th || {};
  const root = document.documentElement;
  root.dataset.mode = ['light','dark'].includes(th.mode) ? th.mode : 'auto';
  document.getElementById('themeVars').textContent = themeCSS(th.accent);
  try{
    const bg = getComputedStyle(root).getPropertyValue('--bg').trim();
    const custom = th.mode === 'light' || th.mode === 'dark' || (th.accent && th.accent !== 'verde');
    document.querySelectorAll('meta[name=theme-color]').forEach(m => {
      if(!m.dataset.orig) m.dataset.orig = m.getAttribute('content');
      m.setAttribute('content', custom ? bg : m.dataset.orig);
    });
  }catch(e){}
}
try{ const s = JSON.parse(localStorage.getItem('julhatasks.v1')); applyTheme(s && s.theme); }catch(e){}
</script>
</head>

    <b>Calendário do ciclo</b><button class="link" style="font-size:15px" data-act="full-today">Hoje</button></div>
  <div class="fc-wd"><span>D</span><span>S</span><span>T</span><span>Q</span><span>Q</span><span>S</span><span>S</span></div>

<script>
/* ---------- dados ---------- */
const DEFAULT_CATS = [
  {id:'aniversario', label:'Aniversário', emoji:'🎂', color:'#D9A441'},
  {id:'passeio',     label:'Passeio',     emoji:'💚', color:'#3E9B6B'},
  {id:'compromisso', label:'Compromisso', emoji:'📌', color:'#4C7FB8'},
  {id:'saude',       label:'Saúde',       emoji:'🩺', color:'#C9625C'},
  {id:'curso',       label:'Curso',       emoji:'✈️', color:'#4FA3D1'},
  {id:'trabalho',    label:'Trabalho',    emoji:'💼', color:'#8A72B8'},
  {id:'outro',       label:'Outro',       emoji:'✨', color:'#8A958E'},
];
const KEY = 'julhatasks.v1';
const MONTHS = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const MONTHS_S = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
const WEEK = ['domingo','segunda-feira','terça-feira','quarta-feira','quinta-feira','sexta-feira','sábado'];

/* nomes e emojis de categoria aparecem direto na tela: tira caracteres de HTML */
const noHtml = v => String(v ?? '').replace(/[<>&"'`]/g, '').trim();
const cleanCat = c => ({id:noHtml(c.id), label:noHtml(c.label).slice(0,24) || 'Categoria', emoji:noHtml(c.emoji).slice(0,16) || '🏷️',
  color:/^#[0-9a-f]{6}$/i.test(c.color) ? c.color : '#8A958E'});
/* aceita dados antigos (sem categorias, saúde ou tema) e completa o que faltar */
function normalize(s){
  const arr = v => Array.isArray(v) ? v : [];
  let cats = arr(s.cats).filter(c => c && c.id && c.label).map(cleanCat);
  if(!cats.length) cats = DEFAULT_CATS.map(c => ({...c}));
  if(!cats.some(c => c.id === 'outro')) cats.push({...DEFAULT_CATS[DEFAULT_CATS.length-1]});
  const h = s.health && typeof s.health === 'object' ? s.health : {};
  return {
    events: arr(s.events), tasks: arr(s.tasks), bills: arr(s.bills), cats,
    health: {days: h.days && typeof h.days === 'object' ? h.days : {}, cycleLen: +h.cycleLen || 28, periodLen: +h.periodLen || 5, waterGoal: +h.waterGoal || 2250},
    theme: s.theme && typeof s.theme === 'object' ? s.theme : {accent:'verde', mode:'auto'},
  };
}
let state = load();
function load(){
  try{
    const s = JSON.parse(localStorage.getItem(KEY));
    if(s && Array.isArray(s.events)) return normalize(s);
  }catch(e){}
  return normalize({});
}
function save(){
  try{ localStorage.setItem(KEY, JSON.stringify(state)); }
  catch(e){ toast('Não consegui salvar 😕'); }
}
let CATS = {};
function rebuildCats(){ CATS = Object.fromEntries(state.cats.map(c => [c.id, c])); }
rebuildCats();
try{ navigator.storage && navigator.storage.persist && navigator.storage.persist(); }catch(e){}

/* ---------- utilidades ---------- */
const $ = s => document.querySelector(s);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const pad = n => String(n).padStart(2,'0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y,m-1,d); };
const todayStr = () => ymd(new Date());
const dayDiff = (a,b) => Math.round((parse(b)-parse(a))/86400000);
const isLeap = y => (y%4===0 && y%100!==0) || y%400===0;
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const cat = ev => CATS[ev.cat] || CATS.outro || DEFAULT_CATS[DEFAULT_CATS.length-1];
const fmtShort = s => { const d = parse(s); return `${d.getDate()} ${MONTHS_S[d.getMonth()]}`; };
const fmtLong = s => { const d = parse(s); return `${WEEK[d.getDay()]}, ${d.getDate()} de ${MONTHS[d.getMonth()]}`; };
const countdown = n => n===0 ? 'hoje' : n===1 ? 'amanhã' : `em ${n} dias`;

/* "Todo ano": uma ocorrência por ano a partir do ano do evento.
   "Toda semana": uma ocorrência a cada 7 dias a partir da data, até a data final (se houver). */
function occFor(ev, year){
  const [y,m,d] = ev.date.split('-').map(Number);
  if(ev.weekly){
    if(year < y) return [];
    const start = parse(ev.date), out = [], done = new Set(ev.doneDates || []);
    const cur = new Date(Math.max(start.getTime(), new Date(year,0,1).getTime()));
    cur.setDate(cur.getDate() + (start.getDay() - cur.getDay() + 7) % 7);
    while(cur.getFullYear() === year){
      const ds = ymd(cur);
      if(ev.until && ds > ev.until) break;
      out.push({ev, date:ds, year, done:done.has(ds)});
      cur.setDate(cur.getDate() + 7);
    }
    return out;
  }
  if(!ev.yearly) return y===year ? [{ev, date:ev.date, year, done:!!ev.done}] : [];
  if(year < y) return [];
  const dd = (m===2 && d===29 && !isLeap(year)) ? 28 : d;
  return [{ev, date:`${year}-${pad(m)}-${pad(dd)}`, year, done:(ev.doneYears||[]).includes(year)}];
}
const weeklyLabel = ev => { const w = parse(ev.date).getDay(); return `${w===0||w===6?'todo':'toda'} ${WEEK[w].replace('-feira','')}`; };
const cmpOcc = (a,b) => a.date.localeCompare(b.date) || (a.ev.time||'99').localeCompare(b.ev.time||'99');
const occInYear = year => state.events.flatMap(e => occFor(e, year)).sort(cmpOcc);

/* ---------- estado da tela ---------- */
const now = new Date();
const ui = { tab:'agenda', y:now.getFullYear(), m:now.getMonth(), sel:todayStr(), hy:now.getFullYear(), showDone:false, full:false, cy:now.getFullYear(), cm:now.getMonth(), hEdit:false, evDraft:null, fm:`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}` };
try{ const t = localStorage.getItem('julhatasks.tab'); if(t) ui.tab = t; }catch(e){}

/* ---------- linhas ---------- */
function occRow(o, opts={}){
  const c = cat(o.ev), sub = [];
  if(opts.showDate) sub.push(fmtShort(o.date));
  if(o.ev.time) sub.push(o.ev.time);
  if(o.ev.yearly) sub.push('todo ano');
  if(o.ev.weekly) sub.push(weeklyLabel(o.ev));
  if(o.ev.note) sub.push(esc(o.ev.note));
  return `<div class="item ${o.done?'done':''}" data-id="${o.ev.id}" data-year="${o.year}" data-date="${o.date}">
    <button class="check" data-act="toggle-ev" aria-label="Marcar como feito"></button>
    <div class="item-body" data-act="edit-ev">
      <div class="item-title"><span class="dot" style="background:${c.color}"></span><span class="t">${esc(o.ev.title)}</span></div>
      <div class="item-sub">${c.emoji} ${sub.length ? sub.join(' · ') : c.label}</div>
    </div>
    ${opts.right || ''}
  </div>`;
}
function taskRow(t){
  return `<div class="item ${t.done?'done':''}" data-tid="${t.id}">
    <button class="check" data-act="toggle-task" aria-label="Concluir tarefa"></button>
    <div class="item-body" data-act="edit-task">
      <div class="item-title"><span class="t">${esc(t.title)}</span></div>
      ${t.note ? `<div class="item-sub">${esc(t.note)}</div>` : ''}
    </div>
    ${t.done ? '' : `<button class="star ${t.important?'on':''}" data-act="star-task" aria-label="Importante">★</button>`}
  </div>`;
}

/* ---------- telas ---------- */
function renderAgenda(){
  const {y, m} = ui, t = todayStr();
  const byDay = {};
  occInYear(y).forEach(o => { if(+o.date.slice(5,7) === m+1) (byDay[o.date] ??= []).push(o); });
  const first = new Date(y,m,1).getDay(), days = new Date(y,m+1,0).getDate();
  let cells = ['D','S','T','Q','Q','S','S'].map(w => `<div class="cal-wd">${w}</div>`).join('');
  for(let i=0;i<first;i++) cells += '<div></div>';
  for(let d=1; d<=days; d++){
    const ds = `${y}-${pad(m+1)}-${pad(d)}`;
    const dots = (byDay[ds]||[]).slice(0,3).map(o => `<i style="background:${cat(o.ev).color};${o.done?'opacity:.35':''}"></i>`).join('');
    cells += `<button class="day ${ds===t?'today':''} ${ds===ui.sel?'sel':''}" data-act="pick" data-date="${ds}"><span>${d}</span><b>${dots}</b></button>`;
  }
  const selList = occInYear(+ui.sel.slice(0,4)).filter(o => o.date === ui.sel);
  return `
  <div class="card">
    <div class="cal-head">
      <h2>${MONTHS[m]} ${y}</h2>
      <div class="cal-nav">
        <button data-act="month" data-d="-1" aria-label="Mês anterior">‹</button>
        <button data-act="today">Hoje</button>
        <button data-act="month" data-d="1" aria-label="Próximo mês">›</button>
      </div>
    </div>
    <div class="cal-grid">${cells}</div>
  </div>
  <div class="section-title">${fmtLong(ui.sel)}${ui.sel===t?' <small>hoje</small>':''}</div>
  <div class="card">
    ${selList.length ? `<div class="list">${selList.map(o => occRow(o)).join('')}</div>`
      : `<div class="empty"><b>🌿</b>Nada marcado neste dia.<br>Toque no + para adicionar.</div>`}
  </div>`;
}

function renderUpcoming(){
  const t = todayStr(), y = new Date().getFullYear();
  const all = [...occInYear(y-1), ...occInYear(y), ...occInYear(y+1)];
  // eventos semanais: só a última semana em pendentes e só a próxima vez em "próximos"
  const pend = all.filter(o => o.date < t && !o.done && dayDiff(o.date, t) <= (o.ev.weekly ? 7 : 60));
  const hoje = all.filter(o => o.date === t);
  const seenWeekly = new Set();
  const next = all.filter(o => {
    if(!(o.date > t && dayDiff(t, o.date) <= 365)) return false;
    if(!o.ev.weekly) return true;
    if(seenWeekly.has(o.ev.id) || all.some(x => x.ev === o.ev && x.date === t)) return false;
    seenWeekly.add(o.ev.id); return true;
  });
  const feat = next.find(o => !o.done);
  let html = '';
  if(feat){
    const n = dayDiff(t, feat.date);
    html += `<div class="hero" data-id="${feat.ev.id}" data-year="${feat.year}" data-act="edit-ev">
      <small>Próximo evento</small>
      <h3>${cat(feat.ev).emoji} ${esc(feat.ev.title)}</h3>
      <p>${fmtLong(feat.date)}${feat.ev.time ? ' · '+feat.ev.time : ''}</p>
      <div class="big">${n===1 ? 'Amanhã' : n+' <span>dias</span>'}</div>
    </div>`;
  }
  if(pend.length){
    html += `<div class="section-title">Pendentes</div><p class="hint">Já passaram — marque o que você fez.</p>
      <div class="card"><div class="list">${pend.map(o => occRow(o,{showDate:true})).join('')}</div></div>`;
  }
  html += `<div class="section-title">Hoje</div><div class="card">${hoje.length
    ? `<div class="list">${hoje.map(o => occRow(o)).join('')}</div>`
    : `<div class="empty" style="padding:14px">Nada para hoje 🌱</div>`}</div>`;
  const groups = {};
  next.forEach(o => (groups[o.date.slice(0,7)] ??= []).push(o));
  Object.keys(groups).forEach(k => {
    const [gy, gm] = k.split('-').map(Number);
    html += `<div class="section-title">${MONTHS[gm-1]}${gy!==y?' '+gy:''}</div>
      <div class="card"><div class="list">${groups[k].map(o => occRow(o,{showDate:true, right:`<span class="pill">${countdown(dayDiff(t,o.date))}</span>`})).join('')}</div></div>`;
  });
  if(!next.length && !hoje.length && !pend.length)
    html += `<div class="card" style="margin-top:12px"><div class="empty"><b>📅</b>Nenhum evento pela frente.<br>Toque no + para criar o primeiro.</div></div>`;
  return html;
}

function renderTasks(){
  const pending = state.tasks.filter(t => !t.done).sort((a,b) => (b.important?1:0)-(a.important?1:0) || a.created - b.created);
  const done = state.tasks.filter(t => t.done).sort((a,b) => (b.doneAt||0)-(a.doneAt||0));
  return `
  <form class="add-row" id="taskForm" autocomplete="off">
    <input name="title" placeholder="Nova tarefa…" maxlength="140" enterkeyhint="done">
    <button type="submit">Adicionar</button>
  </form>
  <div class="section-title">A fazer <small>${pending.length}</small></div>
  <div class="card">${pending.length
    ? `<div class="list">${pending.map(taskRow).join('')}</div>`
    : `<div class="empty"><b>✅</b>Tudo em dia!</div>`}</div>
  ${done.length ? `
  <div class="section-title">Concluídas <small>${done.length}</small>
    <span><button class="link" data-act="toggle-done-list">${ui.showDone?'Ocultar':'Mostrar'}</button>
    ${ui.showDone ? ` · <button class="link" data-act="clear-done">Limpar</button>` : ''}</span></div>
  ${ui.showDone ? `<div class="card"><div class="list">${done.map(taskRow).join('')}</div></div>` : ''}` : ''}`;
}

function renderHistory(){
  const cy = new Date().getFullYear();
  const years = new Set([cy]);
  state.events.forEach(e => {
    const y0 = +e.date.slice(0,4);
    if(e.yearly){ for(let y=y0; y<=cy; y++) years.add(y); }
    else if(e.weekly){ const end = e.until ? Math.min(cy, +e.until.slice(0,4)) : cy; for(let y=y0; y<=end; y++) years.add(y); }
    else years.add(y0);
  });
  const ylist = [...years].sort((a,b) => b-a);
  const occ = occInYear(ui.hy);
  const t = todayStr();
  const relevant = occ.filter(o => o.date <= t || o.done);
  const done = occ.filter(o => o.done);
  const pct = relevant.length ? Math.round(done.length / relevant.length * 100) : 0;
  const byCat = {};
  done.forEach(o => byCat[o.ev.cat] = (byCat[o.ev.cat]||0) + 1);
  const max = Math.max(1, ...Object.values(byCat));
  const catRows = Object.keys(CATS).filter(k => byCat[k]).map(k =>
    `<div class="cat-row"><span>${CATS[k].emoji} ${CATS[k].label}</span><div class="bar"><i style="width:${byCat[k]/max*100}%;background:${CATS[k].color}"></i></div><b>${byCat[k]}</b></div>`).join('');
  const months = {};
  occ.forEach(o => (months[+o.date.slice(5,7)] ??= []).push(o));
  return `
  <div class="years">${ylist.map(y => `<button class="chip ${y===ui.hy?'on':''}" data-act="year" data-y="${y}">${y}</button>`).join('')}</div>
  <div class="card" style="margin-top:8px">
    <div style="font-size:14px;color:var(--muted);font-weight:600;margin-bottom:8px">Retrospectiva ${ui.hy}</div>
    <div class="stat-big">${done.length} <span>evento${done.length===1?'':'s'} concluído${done.length===1?'':'s'}</span></div>
    ${relevant.length ? `<div class="bar"><i style="width:${pct}%"></i></div>
      <div style="font-size:13px;color:var(--muted);margin-top:6px">${pct}% do que já passou foi marcado como feito</div>` : ''}
    ${catRows}
  </div>
  ${Object.keys(months).length ? Object.keys(months).sort((a,b) => a-b).map(mm => `
    <div class="section-title">${MONTHS[mm-1]} <small>${months[mm].filter(o => o.done).length}/${months[mm].length}</small></div>
    <div class="card"><div class="list">${months[mm].map(o => occRow(o,{showDate:true})).join('')}</div></div>`).join('')
  : `<div class="card" style="margin-top:12px"><div class="empty"><b>📖</b>Nenhum evento em ${ui.hy}.</div></div>`}`;
}

/* ---------- finanças ---------- */
const PAYS = {
  credito: {label:'Cartão de crédito', emoji:'💳'},
  debito:  {label:'Débito',  emoji:'🏧'},
  pix:     {label:'Pix',     emoji:'⚡'},
  boleto:  {label:'Boleto',  emoji:'🧾'},
  dinheiro:{label:'Dinheiro',emoji:'💵'},
};
const FCATS = {
  casa:      {label:'Casa',       emoji:'🏠', color:'#4C7FB8'},
  mercado:   {label:'Mercado',    emoji:'🛒', color:'#3E9B6B'},
  compras:   {label:'Compras',    emoji:'🛍️', color:'#D9A441'},
  lazer:     {label:'Lazer',      emoji:'🎉', color:'#8A72B8'},
  saude:     {label:'Saúde',      emoji:'🩺', color:'#C9625C'},
  transporte:{label:'Transporte', emoji:'🚗', color:'#5A9AA8'},
  outros:    {label:'Outros',     emoji:'✨', color:'#8A958E'},
};
const BTYPES = {parcela:'Parcelado', fixa:'Conta fixa', avulso:'Gasto avulso'};
const BRL = new Intl.NumberFormat('pt-BR', {style:'currency', currency:'BRL'});
const money = v => BRL.format(v || 0);
function parseMoney(s){
  s = String(s).trim().replace(/[R$\s]/g, '');
  if(s.includes(',')) s = s.replace(/\./g, '').replace(',', '.');
  else if(/^\d{1,3}(\.\d{3})+$/.test(s)) s = s.replace(/\./g, '');
  const v = parseFloat(s);
  return isFinite(v) ? Math.round(v * 100) / 100 : NaN;
}
const ymAdd = (s, k) => { const [y,m] = s.split('-').map(Number); const d = new Date(y, m-1+k, 1); return `${d.getFullYear()}-${pad(d.getMonth()+1)}`; };
const ymDiff = (a, b) => { const [ay,am] = a.split('-').map(Number), [by,bm] = b.split('-').map(Number); return (by-ay)*12 + (bm-am); };
const fmtYM = s => { const [y,m] = s.split('-').map(Number); return `${MONTHS[m-1]} ${y}`; };
const curYM = () => todayStr().slice(0,7);

/* parcelado: N meses a partir do primeiro; conta fixa: todo mês até "parar"; avulso: só no mês escolhido */
function billOcc(b, M){
  const i = ymDiff(b.start, M);
  if(i < 0) return null;
  if(b.type === 'parcela' && i >= b.n) return null;
  if(b.type === 'avulso' && i !== 0) return null;
  if(b.type === 'fixa' && b.end && M > b.end) return null;
  return {b, month:M, k:i+1, paid:(b.paid||[]).includes(M)};
}
const billsInMonth = M => state.bills.map(b => billOcc(b, M)).filter(Boolean)
  .sort((x,y) => (x.b.day||32) - (y.b.day||32) || x.b.title.localeCompare(y.b.title));
const sumOf = list => Math.round(list.reduce((s,o) => s + (+o.b.amount || 0), 0) * 100) / 100;

function billRow(o){
  const b = o.b, c = FCATS[b.cat] || FCATS.outros, p = PAYS[b.pay], sub = [];
  if(b.type === 'parcela') sub.push(`Parcela ${o.k}/${b.n}`);
  else if(b.type === 'fixa') sub.push('Todo mês');
  if(b.who) sub.push(esc(b.who));
  if(b.day) sub.push(`vence dia ${b.day}`);
  if(p) sub.push(`${p.emoji} ${p.label}`);
  const cm = curYM(), late = !o.paid && (o.month < cm || (o.month === cm && b.day && b.day < new Date().getDate()));
  return `<div class="item ${o.paid?'done':''}" data-bid="${b.id}" data-month="${o.month}">
    <button class="check" data-act="toggle-bill" aria-label="Marcar como pago"></button>
    <div class="item-body" data-act="edit-bill">
      <div class="item-title"><span class="dot" style="background:${c.color}"></span><span class="t">${esc(b.title)}</span></div>
      <div class="item-sub">${c.emoji} ${sub.join(' · ')}</div>
    </div>
    <div class="amt">${money(b.amount)}${late ? '<small class="late">atrasada</small>' : ''}</div>
  </div>`;
}

function renderFinance(){
  const M = ui.fm, list = billsInMonth(M);
  const total = sumOf(list), paid = sumOf(list.filter(o => o.paid)), left = Math.round((total - paid) * 100) / 100;
  const pct = total ? Math.round(paid / total * 100) : 0;
  const group = (key, dict) => {
    const g = {};
    list.forEach(o => { const k = dict[o.b[key]] ? o.b[key] : Object.keys(dict).pop(); g[k] = (g[k]||0) + (+o.b.amount||0); });
    const max = Math.max(1, ...Object.values(g));
    return Object.keys(dict).filter(k => g[k]).sort((a,b) => g[b]-g[a]).map(k =>
      `<div class="cat-row"><span>${dict[k].emoji} ${dict[k].label}</span><div class="bar"><i style="width:${g[k]/max*100}%;${dict[k].color?'background:'+dict[k].color:''}"></i></div><b>${money(g[k])}</b></div>`).join('');
  };
  const last6 = [-5,-4,-3,-2,-1,0].map(k => { const m = ymAdd(M, k); return {m, v:sumOf(billsInMonth(m))}; });
  const max6 = Math.max(1, ...last6.map(x => x.v));
  const plans = state.bills.filter(b => b.type === 'parcela').map(b => {
    const paidN = (b.paid||[]).filter(m => { const i = ymDiff(b.start, m); return i >= 0 && i < b.n; }).length;
    return {b, paidN};
  }).filter(x => x.paidN < x.b.n);
  return `
  <div class="card">
    <div class="cal-head">
      <h2>${fmtYM(M)}</h2>
      <div class="cal-nav">
        <button data-act="fmonth" data-d="-1" aria-label="Mês anterior">‹</button>
        <button data-act="fmonth" data-d="0">Hoje</button>
        <button data-act="fmonth" data-d="1" aria-label="Próximo mês">›</button>
      </div>
    </div>
    <div style="font-size:13px;color:var(--muted);font-weight:600">Total do mês</div>
    <div class="stat-big" style="margin-top:4px">${money(total)}</div>
    <div class="bar"><i style="width:${pct}%"></i></div>
    <div class="fin-split">
      <div><small>Pago</small><b>${money(paid)}</b></div>
      <div><small>Falta pagar</small><b style="${left>0?'color:var(--danger)':''}">${money(left)}</b></div>
    </div>
  </div>
  <div class="section-title">Contas de ${MONTHS[+M.slice(5)-1]} <small>${list.filter(o=>o.paid).length}/${list.length} pagas</small></div>
  <div class="card">${list.length
    ? `<div class="list">${list.map(billRow).join('')}</div>`
    : `<div class="empty"><b>💸</b>Nada lançado neste mês.<br>Toque no + para adicionar.</div>`}</div>
  ${list.length ? `
  <div class="section-title">Resumo do mês</div>
  <div class="card">
    <div style="font-size:13px;color:var(--muted);font-weight:600">Por forma de pagamento</div>${group('pay', PAYS)}
    <div style="font-size:13px;color:var(--muted);font-weight:600;margin-top:18px">Por categoria</div>${group('cat', FCATS)}
  </div>` : ''}
  <div class="section-title">Últimos 6 meses</div>
  <div class="card"><div class="months6">${last6.map(x => `
    <div class="mcol ${x.m===M?'on':''}" data-act="fgo" data-m="${x.m}">
      <em>${x.v ? money(x.v).replace(/,\d\d$/,'') : ''}</em>
      <i style="height:${Math.max(3, x.v/max6*80)}px"></i>
      <small>${MONTHS_S[+x.m.slice(5)-1]}</small>
    </div>`).join('')}</div></div>
  ${plans.length ? `
  <div class="section-title">Parcelas em andamento</div>
  <div class="card"><div class="list">${plans.map(({b, paidN}) => `
    <div class="item" data-bid="${b.id}">
      <div class="item-body" data-act="edit-bill">
        <div class="item-title"><span class="t">${esc(b.title)}</span></div>
        <div class="item-sub">${paidN} de ${b.n} pagas · falta ${money((b.n-paidN)*b.amount)}${b.who?' · '+esc(b.who):''}</div>
        <div class="bar" style="height:6px;margin-top:8px"><i style="width:${paidN/b.n*100}%"></i></div>
      </div>
      <div class="amt">${money(b.amount)}<small>/mês</small></div>
    </div>`).join('')}</div></div>` : ''}`;
}

function billForm(b){
  const isNew = !b;
  b = b || {type:'parcela', title:'', who:'', amount:'', n:3, start:ui.fm, day:'', pay:'credito', cat:'compras', note:''};
  const chips = (name, dict, val) => Object.entries(dict).map(([k,c]) =>
    `<label><input type="radio" name="${name}" value="${k}" ${val===k?'checked':''}><span>${c.emoji} ${c.label}</span></label>`).join('');

  return `<form id="billForm" data-id="${isNew?'':b.id}" autocomplete="off">
    <h2>${isNew ? 'Novo lançamento' : 'Editar lançamento'}</h2>

      `<label><input type="radio" name="type" value="${k}" ${b.type===k?'checked':''}><span>${l}</span></label>`).join('')}</div>

    <div class="row2">
      <label class="field"><span data-lbl-amount>Valor</span><input name="amount" required inputmode="decimal" value="${amt}" placeholder="R$ 0,00"></label>
      <label class="field" data-only="parcela">Nº de parcelas<input name="n" type="number" inputmode="numeric" min="1" max="120" value="${b.n||3}"></label>
    </div>
    <div class="fin-preview" data-only="parcela" id="billTotal"></div>
    <label class="field">Para quem / onde<input name="who" maxlength="80" value="${esc(b.who||'')}" placeholder="Ex.: Nubank, Magalu, Ana…"></label>
    <div class="row2">
      <label class="field"><span data-lbl-start>Primeiro mês</span><input name="start" type="month" required value="${b.start}"></label>
      <label class="field">Dia do vencimento<input name="day" type="number" inputmode="numeric" min="1" max="31" value="${b.day||''}" placeholder="Opcional"></label>
    </div>

    <div class="cats">${chips('cat', FCATS, b.cat)}</div>
    <label class="field">Observação<textarea name="note" rows="2" maxlength="300" placeholder="Opcional">${esc(b.note||'')}</textarea></label>
    ${!isNew && b.type === 'fixa' ? `<button type="button" class="menu-btn" data-act="stop-bill" style="justify-content:center">⏹️ ${b.end ? `Termina em ${fmtYM(b.end)} · voltar a repetir` : `Parar de repetir depois de ${fmtYM(ui.fm)}`}</button>` : ''}
    <div class="actions">
      ${isNew ? `<button type="button" class="btn ghost" data-act="close-sheet">Cancelar</button>` : `<button type="button" class="btn ghost danger" data-act="delete-bill">Excluir</button>`}
      <button type="submit" class="btn primary">Salvar</button>
    </div>
  </form>`;
}
function syncBillForm(f){
  if(!f) return;
  const t = f.elements.type.value;
  f.querySelectorAll('[data-only]').forEach(el => el.hidden = el.dataset.only !== t);
  f.querySelector('[data-lbl-amount]').textContent = t === 'parcela' ? 'Valor da parcela' : 'Valor';
  f.querySelector('[data-lbl-start]').textContent = t === 'avulso' ? 'Mês' : 'Primeiro mês';
  if(t === 'parcela'){
    const v = parseMoney(f.elements.amount.value), n = parseInt(f.elements.n.value, 10);
    const start = f.elements.start.value;
    $('#billTotal').innerHTML = (v > 0 && n > 0)
      ? `${n}× de ${money(v)} = <b>${money(v*n)}</b>${start && n > 1 ? ` · até ${fmtYM(ymAdd(start, n-1))}` : ''}`
      : 'Preencha o valor e o número de parcelas';
  }
}
const findBill = el => { const it = el.closest('[data-bid]'); return it && {b: state.bills.find(x => x.id === it.dataset.bid), month: it.dataset.month}; };

document.addEventListener('input', e => { const f = e.target.form; if(f && f.id === 'billForm') syncBillForm(f); });
document.addEventListener('change', e => { const f = e.target.form; if(f && f.id === 'billForm') syncBillForm(f); });

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if(!el) return;
  switch(el.dataset.act){
    case 'fmonth': ui.fm = +el.dataset.d ? ymAdd(ui.fm, +el.dataset.d) : curYM(); render(); break;
    case 'fgo': ui.fm = el.dataset.m; render(); break;
    case 'toggle-bill': {
      const f = findBill(el); if(!f || !f.b) break;
      const s = new Set(f.b.paid || []), nowPaid = !s.has(f.month);
      nowPaid ? s.add(f.month) : s.delete(f.month); f.b.paid = [...s];
      save(); render(); if(nowPaid) toast('Pago! 💚'); break; }
    case 'edit-bill': { const f = findBill(el); if(f && f.b){ openSheet(billForm(f.b)); syncBillForm($('#billForm')); } break; }
    case 'delete-bill': {
      const id = $('#billForm').dataset.id;
      if(confirm('Excluir este lançamento? Ele some de todos os meses.')){ state.bills = state.bills.filter(b => b.id !== id); save(); closeSheet(); render(); }
      break; }
    case 'stop-bill': {
      const b = state.bills.find(x => x.id === $('#billForm').dataset.id); if(!b) break;
      if(b.end){ delete b.end; toast('Voltou a repetir todo mês'); }
      else { b.end = ui.fm < b.start ? b.start : ui.fm; toast(`Termina em ${fmtYM(b.end)}`); }
      save(); closeSheet(); render(); break; }
  }
});

document.addEventListener('submit', e => {
  const f = e.target; if(f.id !== 'billForm') return;
  e.preventDefault();
  const el = f.elements, type = el.type.value;
  const amount = parseMoney(el.amount.value);
  if(!(amount > 0)){ toast('Valor inválido'); return; }
  const n = type === 'parcela' ? Math.min(120, Math.max(1, parseInt(el.n.value, 10) || 1)) : 1;
  const day = parseInt(el.day.value, 10);
  const data = {
    type, title: el.title.value.trim(), who: el.who.value.trim(), amount, n,
    start: el.start.value || ui.fm, day: day >= 1 && day <= 31 ? day : '',
    pay: (f.querySelector('input[name=pay]:checked') || {}).value || 'pix',
    cat: (f.querySelector('input[name=cat]:checked') || {}).value || 'outros',
    note: el.note.value.trim(),
  };
  if(!data.title) return;
  const id = f.dataset.id;
  if(id){ const b = state.bills.find(x => x.id === id); if(b){ if(type !== 'fixa') delete b.end; Object.assign(b, data); } }
  else state.bills.push({id:uid(), ...data, paid:[], created:Date.now()});
  if(!id) ui.fm = data.start;
  save(); closeSheet(); render(); toast(id ? 'Lançamento atualizado' : 'Lançamento criado 💚');
});

};

const PILLS = {hora:'Tomei no horário', ontem:'Tomei a pílula de ontem', esqueci:'Esqueci'};
/* registros antigos guardavam "pílula" junto com os outros; agora é "tomei no horário" */
const pillsOf = e => { const p = new Set((e && e.pill) || []); if(e && (e.extra||[]).includes('pilula')) p.add('hora'); return [...p]; };
const PHASES = {
  menstrual:{n:'Fase menstrual', tip:'Descanse quando der, beba bastante água e uma bolsa de água quente ajuda na cólica. 💗'},
  folicular:{n:'Fase folicular', tip:'A energia costuma subir nessa fase. Ótimo momento pra treinar e começar coisas novas. ✨'},
  fertil:   {n:'Período fértil', tip:'Fase de maior chance de gravidez. A disposição e o humor costumam estar em alta. 🌸'},
  ovulacao: {n:'Ovulação provável', tip:'Hoje é o dia com maior chance de gravidez do ciclo. 🌸'},
  lutea:    {n:'Fase lútea', tip:'É normal sentir mais inchaço, fome ou sensibilidade agora. Seja gentil com você. 🍫'},
  atrasada: {n:'Atrasada', tip:'Atrasos podem vir de estresse, viagens ou mudança de rotina. Se continuar, vale fazer um teste ou falar com a ginecologista.'},
};
const addDays = (s, n) => { const d = parse(s); d.setDate(d.getDate() + n); return ymd(d); };
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const hasLog = e => e && ((e.sym||[]).length || (e.mood||[]).length || (e.extra||[]).length || (e.pill||[]).length || e.note || e.sex || e.water);
const SEX = ['Não','Protegida','Sem proteção'];
const EDIT_HINT = {per:'Toque nos dias em que você menstruou. Toque de novo para desmarcar.', sex:'Toque nos dias em que teve relação ♥. Toque de novo para desmarcar.'};
/* células de um mês do calendário de saúde (usado no card e no calendário completo) */
function monthCells(y, mo, marks, t){
  const D = state.health.days, first = new Date(y, mo, 1).getDay(), days = new Date(y, mo + 1, 0).getDate();
  let cells = '';
  for(let i = 0; i < first; i++) cells += '<div></div>';
  for(let d = 1; d <= days; d++){
    const ds = `${y}-${pad(mo+1)}-${pad(d)}`, e = D[ds];
    const below = e && e.sex ? '<b class="hb">♥</b>' : `<b>${hasLog(e) ? '<i style="background:var(--muted)"></i>' : ''}</b>`;
    cells += `<button class="day hday ${marks[ds]||''} ${ds===t?'today':''} ${ds>t?'future':''}" data-act="h-day" data-date="${ds}"><span>${d}</span>${below}</button>`;
  }
  return cells;
}
const LEGEND = `<div class="legend"><span><i style="background:var(--period)"></i>Menstruação</span><span><i style="border:2px dashed var(--period)"></i>Previsão</span>
  <span><i style="background:var(--fertile-soft);border:1px solid var(--fertile)"></i>Fértil</span><span><i style="background:var(--fertile)"></i>Ovulação</span><span><b style="color:var(--period)">♥</b> Relação</span></div>`;
function renderFull(keepScroll){
  const body = $('#fcBody'), top = body.scrollTop;
  const info = healthData(), marks = healthMarks(info), t = info.t, now = new Date();
  let html = '';
  for(let k = -12; k <= 12; k++){
    const d = new Date(now.getFullYear(), now.getMonth() + k, 1), y = d.getFullYear();
    html += `<div class="fc-month" data-ym="${y}-${pad(d.getMonth()+1)}"><h3>${MONTHS[d.getMonth()]}${y !== now.getFullYear() ? ' ' + y : ''}</h3>
      <div class="cal-grid">${monthCells(y, d.getMonth(), marks, t)}</div></div>`;
  }
  body.innerHTML = html;
  body.classList.toggle('editing', !!ui.hEdit);
  $('#fcFoot').innerHTML = ui.hEdit
    ? `<p class="hint" style="margin:0 2px 10px;text-align:center">${EDIT_HINT[ui.hEdit]}</p><button class="btn primary" style="width:100%" data-act="h-edit" data-mode="${ui.hEdit}">Pronto</button>`
    : `${LEGEND.replace('class="legend"', 'class="legend" style="margin:0 0 10px;justify-content:center"')}<div class="hbtns" style="margin:0"><button class="btn period" data-act="h-edit" data-mode="per">✏️ Menstruação</button><button class="btn ghost" data-act="h-edit" data-mode="sex">♥ Relação</button></div>`;
  if(keepScroll) body.scrollTop = top;
}
function openFull(){
  ui.full = true; $('#fullcal').hidden = false; document.body.classList.add('lock2');
  renderFull(false);
  const cur = $('#fcBody').querySelector(`[data-ym="${curYM()}"]`); if(cur) $('#fcBody').scrollTop = cur.offsetTop - 8;
}
function closeFull(){ ui.full = false; ui.hEdit = false; $('#fullcal').hidden = true; document.body.classList.remove('lock2'); render(); }
const avgOf = a => Math.round(a.reduce((x,y) => x + y, 0) / a.length);

/* dias seguidos de menstruação (aceita 1 dia de falha no meio) viram um período */
function periods(){
  const out = [];
  Object.keys(state.health.days).filter(d => state.health.days[d].flow > 0).sort().forEach(d => {
    const last = out[out.length-1];
    if(last && dayDiff(last.end, d) <= 2) last.end = d; else out.push({start:d, end:d});
  });
  return out;
}
function healthData(){
  const H = state.health, t = todayStr(), ps = periods();
  const lens = [];
  for(let i = 1; i < ps.length; i++){ const L = dayDiff(ps[i-1].start, ps[i].start); if(L >= 15 && L <= 60) lens.push(L); }
  const cycleLen = lens.length ? avgOf(lens.slice(-6)) : H.cycleLen;
  const last = ps[ps.length-1];
  const finished = ps.filter(p => p !== last || dayDiff(p.end, t) > 1).map(p => dayDiff(p.start, p.end) + 1).filter(n => n <= 12);
  const periodLen = finished.length ? avgOf(finished.slice(-6)) : H.periodLen;
  const info = {ps, lens, cycleLen, periodLen, last, t};
  if(!last) return info;
  info.day = dayDiff(last.start, t) + 1;
  info.next = addDays(last.start, cycleLen);
  info.late = dayDiff(info.next, t);
  info.inPeriod = t <= last.end || (dayDiff(last.end, t) === 1 && info.day <= periodLen);
  info.ov = addDays(last.start, cycleLen - 14);
  info.fStart = addDays(info.ov, -5); info.fEnd = addDays(info.ov, 1);
  info.phase = info.inPeriod ? 'menstrual' : info.late > 0 ? 'atrasada'
    : t === info.ov ? 'ovulacao' : (t >= info.fStart && t <= info.fEnd) ? 'fertil' : t < info.fStart ? 'folicular' : 'lutea';
  return info;
}
/* marca cada dia do calendário: menstruação, previsão, fértil, ovulação */
function healthMarks(info){
  const m = {};
  Object.entries(state.health.days).forEach(([d, v]) => { if(v.flow > 0) m[d] = 'per'; });
  if(!info.last) return m;
  const put = (d, c) => { if(!m[d]) m[d] = c; };
  const t = info.t, L = info.cycleLen;
  if(info.inPeriod) for(let i = 0; i < info.periodLen; i++){ const d = addDays(info.last.start, i); if(d > t) put(d, 'pred'); }
  for(let k = 0; k <= 6; k++){
    // se atrasou, as próximas previsões partem de hoje
    const S = k === 0 ? info.last.start : info.late > 0 ? addDays(t, (k-1) * L) : addDays(info.last.start, k * L);
    if(k > 0) for(let i = 0; i < info.periodLen; i++){ const d = addDays(S, i); if(d >= t) put(d, 'pred'); }
    if(k === 0 && info.late > 0) continue;
    const ov = addDays(S, L - 14);
    put(ov, 'ovu');
    for(let i = -5; i <= 1; i++) if(i) put(addDays(ov, i), 'fert');
  }
  return m;
}

function renderHealth(){
  const info = healthData(), t = info.t, H = state.health;
  let html = '';
  if(!info.last){
    html += `<div class="card cycle-hero"><div style="font-size:46px;line-height:1.2">🌸</div><h3>Seu ciclo</h3>
      <p>Registre a sua última menstruação e o app passa a prever a próxima, o período fértil e a ovulação.</p>
      <div class="hbtns"><button class="btn period" data-act="h-first">Registrar última menstruação</button></div></div>`;
  } else {
    const R = 52, C = 2 * Math.PI * R, frac = Math.min(1, info.day / info.cycleLen);
    const col = info.inPeriod ? 'var(--period)' : info.late > 0 ? 'var(--danger)' : (info.phase === 'fertil' || info.phase === 'ovulacao') ? 'var(--fertile)' : 'var(--green)';
    let h3, p;
    if(info.inPeriod){ h3 = `Menstruação · dia ${info.day}`; p = `Deve terminar por volta de ${fmtShort(addDays(info.last.start, info.periodLen - 1))}`; }
    else if(info.late > 0){ h3 = `Atrasada ${info.late} dia${info.late > 1 ? 's' : ''}`; p = `Era prevista para ${fmtShort(info.next)}`; }
    else if(info.late === 0){ h3 = 'Menstruação prevista para hoje'; p = 'Toque em “Começou hoje” quando vier'; }
    else { const n = -info.late; h3 = n === 1 ? 'Menstruação amanhã' : `Menstruação em ${n} dias`; p = `Previsão: ${fmtLong(info.next)}`; }
    let f = '';
    if(!info.inPeriod && info.late < 0){
      if(t < info.fStart){ const n = dayDiff(t, info.fStart); f = `Período fértil ${n === 1 ? 'amanhã' : `em ${n} dias`} (${fmtShort(info.fStart)} a ${fmtShort(info.fEnd)})`; }
      else if(t <= info.fEnd) f = t === info.ov ? 'Hoje é o dia provável da ovulação' : `No período fértil até ${fmtShort(info.fEnd)}`;
    }
    const today = H.days[t] || {};
    const b1 = today.flow > 0
      ? `<button class="btn ghost" data-act="h-log" data-date="${t}">🩸 Hoje: ${FLOWS[today.flow].toLowerCase()}</button>`
      : `<button class="btn period" data-act="h-today">🩸 ${info.inPeriod ? 'Marcar hoje' : 'Começou hoje'}</button>`;
    html += `<div class="card cycle-hero">
      <div class="ring"><svg viewBox="0 0 120 120"><circle cx="60" cy="60" r="${R}" fill="none" stroke="var(--surface2)" stroke-width="10"/>
        <circle cx="60" cy="60" r="${R}" fill="none" stroke="${col}" stroke-width="10" stroke-linecap="round" stroke-dasharray="${(C*frac).toFixed(1)} ${C.toFixed(1)}"/></svg>
        <div class="c"><small>Dia</small><b>${info.day}</b><small>do ciclo</small></div></div>
      <h3>${h3}</h3><p>${p}</p>${f ? `<p>${f}</p>` : ''}
      <span class="phase ${info.phase}">${PHASES[info.phase].n}</span>
      <div class="hbtns">${b1}<button class="btn ghost" data-act="h-log" data-date="${t}">📝 Como estou</button></div>
    </div>
    <div class="tip">${PHASES[info.phase].tip}</div>`;
  }

  // pílula de hoje
  const pt = pillsOf(H.days[t]);
  const yest = pillsOf(H.days[addDays(t, -1)]);
  let streak = 0; for(let d = pt.includes('hora') || pt.includes('ontem') ? t : addDays(t, -1); ; d = addDays(d, -1)){
    const p = pillsOf(H.days[d]); if(p.includes('hora') || p.includes('ontem')) streak++; else break; }
  html += `<div class="section-title">💊 Pílula de hoje${streak > 1 ? ` <small>${streak} dias seguidos</small>` : ''}</div>
  <div class="card"><div class="cats" style="margin:0">${Object.entries(PILLS).map(([k, l]) =>
    `<label><input type="checkbox" data-pill="${k}" ${pt.includes(k) ? 'checked' : ''}><span>${k === 'hora' ? '✅' : k === 'ontem' ? '⏰' : '❌'} ${l}</span></label>`).join('')}</div>
    ${!yest.length && !pt.includes('ontem') && Object.keys(H.days).some(d => pillsOf(H.days[d]).length) ? '<p class="hint" style="margin:10px 2px 0">Ontem não tem pílula registrada. Se tomou atrasada hoje, marque “Tomei a pílula de ontem”.</p>' : ''}
  </div>`;

  // água de hoje
  const wt = (H.days[t] || {}).water || 0, goal = H.waterGoal || 2250;
  html += `<div class="section-title">💧 Água</div>
  <div class="card"><div class="water">
    <button class="wbtn" data-act="h-water" data-d="-250" aria-label="Menos um copo" ${wt ? '' : 'disabled'}>−</button>
    <div class="wmid"><b>${liters(wt)}</b> <span>/ ${liters(goal)}</span>${wt >= goal ? ' 🎉' : ''}<div class="bar"><i style="width:${Math.min(100, wt / goal * 100)}%;background:var(--fertile)"></i></div></div>
    <button class="wbtn plus" data-act="h-water" data-d="250" aria-label="Mais um copo">+</button>
  </div><p class="hint" style="margin:8px 2px 0">Cada toque no + é um copo de 250 ml.</p></div>`;

  // calendário
  const y = ui.cy, mo = ui.cm, marks = healthMarks(info);
  const cells = ['D','S','T','Q','Q','S','S'].map(w => `<div class="cal-wd">${w}</div>`).join('') + monthCells(y, mo, marks, t);
  html += `<div class="section-title">Calendário</div>
  <div class="card hcal ${ui.hEdit ? 'editing' : ''}">
    <div class="cal-head"><h2>${MONTHS[mo]} ${y}</h2>
      <div class="cal-nav"><button data-act="h-month" data-d="-1" aria-label="Mês anterior">‹</button><button data-act="h-month" data-d="0">Hoje</button><button data-act="h-month" data-d="1" aria-label="Próximo mês">›</button></div></div>
    ${ui.hEdit ? `<p class="hint" style="margin:0 2px 8px">${EDIT_HINT[ui.hEdit]}</p>` : ''}
    <div class="cal-grid">${cells}</div>
    ${LEGEND}
    <div class="hbtns" style="margin-top:12px">${ui.hEdit
      ? `<button class="btn primary" data-act="h-edit" data-mode="${ui.hEdit}">Pronto</button>`
      : `<button class="btn ghost" data-act="h-edit" data-mode="per">✏️ Menstruação</button><button class="btn ghost" data-act="h-full">🗓️ Calendário completo</button>`}</div>
  </div>`;

  // resumo e histórico
  if(info.last){
    const since = addDays(t, -90), cnt = {};
    Object.entries(H.days).forEach(([d, e]) => { if(d >= since) (e.sym||[]).forEach(k => cnt[k] = (cnt[k]||0) + 1); });
    const top = Object.keys(cnt).filter(k => SYMPTOMS[k]).sort((a,b) => cnt[b] - cnt[a]).slice(0,3);
    html += `<div class="section-title">Resumo</div>
    <div class="card">
      <div class="stats3"><div><b>${info.cycleLen}</b><small>dias de ciclo</small></div><div><b>${info.periodLen}</b><small>dias de menstruação</small></div><div><b>${info.ps.length}</b><small>menstruações registradas</small></div></div>
      ${info.lens.length < 2 ? '<p class="hint" style="margin:10px 2px 0">As médias ficam mais certinhas depois de 2 ou 3 ciclos registrados.</p>' : ''}
      ${(n => n ? `<p style="margin:12px 2px 0;font-size:14px"><b style="color:var(--period)">♥</b> ${n} ${n > 1 ? 'relações' : 'relação'} neste ciclo</p>` : '')(Object.entries(H.days).filter(([d, e]) => e.sex && d >= info.last.start).length)}
      ${top.length ? `<p style="margin:12px 2px 0;font-size:14px"><b>Mais registrados (90 dias):</b> ${top.map(k => `${SYMPTOMS[k]} (${cnt[k]})`).join(', ')}</p>` : ''}
    </div>
    <div class="section-title">Histórico</div>
    <div class="card"><div class="list">${info.ps.map((p, i) => ({p, i})).slice(-8).reverse().map(({p, i}) => {
      const nx = info.ps[i+1], len = dayDiff(p.start, p.end) + 1, py = p.start.slice(0,4);
      return `<div class="item" data-act="h-go" data-date="${p.start}" style="cursor:pointer">
        <span class="cat-emoji" style="background:var(--period-soft)">🩸</span>
        <div class="item-body"><div class="item-title"><span class="t">${fmtShort(p.start)}${+py !== new Date().getFullYear() ? ' ' + py : ''}</span></div>
          <div class="item-sub">Menstruação de ${len} dia${len > 1 ? 's' : ''} · ${nx ? `ciclo de ${dayDiff(p.start, nx.start)} dias` : 'ciclo atual'}</div></div>
        <span class="chev">›</span></div>`; }).join('')}</div></div>`;
  }
  html += `<button class="menu-btn" data-act="h-settings" style="margin-top:16px">⚙️<div>Ajustes da saúde<small>Ciclo de ${H.cycleLen} dias · menstruação de ${H.periodLen} dias · água ${liters(H.waterGoal||2250)} por dia</small></div></button>
    <p class="hint" style="text-align:center;margin:14px 8px 0">As previsões são estimativas feitas a partir dos seus registros e não servem como método anticoncepcional.</p>`;
  return html;
}

function hLogForm(ds){
  const e = state.health.days[ds] || {};
  const multi = (name, dict, arr) => Object.entries(dict).map(([k, l]) =>
    `<label><input type="checkbox" name="${name}" value="${k}" ${(arr||[]).includes(k)?'checked':''}><span>${l}</span></label>`).join('');
  return `<form id="hLog" data-date="${ds}" autocomplete="off">
    <h2>${cap(fmtLong(ds))}</h2>
    <div class="field" style="margin-bottom:6px">Menstruação</div>
    <div class="seg period-seg">${FLOWS.map((l, i) => `<label><input type="radio" name="flow" value="${i}" ${(e.flow||0)===i?'checked':''}><span>${l}</span></label>`).join('')}</div>
    <div class="field" style="margin-bottom:6px">♥ Relação</div>
    <div class="seg period-seg">${SEX.map((l, i) => `<label><input type="radio" name="sex" value="${i}" ${(e.sex||0)===i?'checked':''}><span>${l}</span></label>`).join('')}</div>
    <div class="field" style="margin-bottom:0">Sintomas</div><div class="cats">${multi('sym', SYMPTOMS, e.sym)}</div>
    <div class="field" style="margin-bottom:0">Humor</div><div class="cats">${multi('mood', MOODS, e.mood)}</div>
    <div class="field" style="margin-bottom:0">💊 Pílula anticoncepcional</div><div class="cats">${multi('pill', PILLS, pillsOf(e))}</div>
    <div class="field" style="margin-bottom:0">Outros</div><div class="cats">${multi('extra', EXTRAS, (e.extra||[]).filter(k => k !== 'pilula' && k !== 'agua'))}</div>
    <label class="field">💧 Água (ml)<input type="number" name="water" inputmode="numeric" min="0" max="10000" step="250" value="${e.water||''}" placeholder="0"></label>
    <label class="field">Anotação<textarea name="note" rows="2" maxlength="300" placeholder="Opcional">${esc(e.note||'')}</textarea></label>
    <div class="actions"><button type="button" class="btn ghost" data-act="close-sheet">Cancelar</button><button type="submit" class="btn primary">Salvar</button></div>
  </form>`;
}
function hSettingsForm(first){
  const H = state.health;
  return `<form id="hSet" data-first="${first ? 1 : ''}" autocomplete="off">
    <h2>${first ? 'Última menstruação' : 'Ajustes da saúde'}</h2>
    ${first ? `<label class="field">Em que dia ela começou?<input type="date" name="start" required max="${todayStr()}" value="${addDays(todayStr(), -14)}"></label>` : ''}
    <div class="row2">
      <label class="field">Ciclo (dias)<input type="number" name="cycleLen" inputmode="numeric" min="20" max="45" value="${H.cycleLen}"></label>
      <label class="field">Menstruação (dias)<input type="number" name="periodLen" inputmode="numeric" min="2" max="10" value="${H.periodLen}"></label>
    </div>
    ${first ? '' : `<label class="field">Meta de água por dia (litros)<input name="waterGoal" inputmode="decimal" value="${String((H.waterGoal||2250)/1000).replace('.', ',')}"></label>`}
    <p class="hint" style="margin:-4px 2px 16px">O ciclo vai do primeiro dia de uma menstruação até o dia antes da próxima. Na dúvida, deixe 28 e 5: depois de alguns registros o app calcula a sua média sozinho.</p>
    <div class="actions"><button type="button" class="btn ghost" data-act="close-sheet">Cancelar</button><button type="submit" class="btn primary">Salvar</button></div>
  </form>`;
}
function setFlow(ds, flow){
  const H = state.health, e = {...(H.days[ds] || {})};
  if(flow > 0) e.flow = flow; else delete e.flow;
  if(e.flow || hasLog(e)) H.days[ds] = e; else delete H.days[ds];
}

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if(!el) return;
  switch(el.dataset.act){
    // categorias
    case 'cats': ui.evDraft = null; openSheet(catList()); break;
    case 'new-cat': openSheet(catForm(null)); syncCatForm($('#catForm')); break;
    case 'edit-cat': { const c = CATS[el.closest('[data-cid]').dataset.cid]; if(c){ openSheet(catForm(c)); syncCatForm($('#catForm')); } break; }
    case 'pick-emoji': { const f = $('#catForm'); if(f){ f.elements.emoji.value = el.dataset.e; syncCatForm(f); } break; }
    case 'delete-cat': {
      const id = $('#catForm').dataset.cid, c = CATS[id]; if(!c || id === 'outro') break;
      const n = state.events.filter(ev => ev.cat === id).length;
      if(confirm(`Excluir a categoria “${c.label}”?${n ? ` Os ${n} evento${n>1?'s':''} dela passam para “${CATS.outro.label}”.` : ''}`)){
        state.events.forEach(ev => { if(ev.cat === id) ev.cat = 'outro'; });
        state.cats = state.cats.filter(x => x.id !== id); rebuildCats(); save(); render(); openSheet(catList()); toast('Categoria excluída');
      }
      break; }
    // aparência
    case 'appearance': openSheet(appearanceSheet()); break;
    case 'set-accent':
      setTheme({accent: el.dataset.k});
      document.querySelectorAll('.sw[data-k]').forEach(b => b.classList.toggle('on', b === el)); break;
    // saúde
    case 'h-month': {
      const d = +el.dataset.d ? new Date(ui.cy, ui.cm + (+el.dataset.d), 1) : new Date();
      ui.cy = d.getFullYear(); ui.cm = d.getMonth(); render(); break; }
    case 'h-go': { const d = parse(el.dataset.date); ui.cy = d.getFullYear(); ui.cm = d.getMonth(); render(); window.scrollTo({top:0, behavior:'smooth'}); break; }
    case 'h-edit': ui.hEdit = ui.hEdit === el.dataset.mode ? false : el.dataset.mode; render(); break;
    case 'h-full': ui.hEdit = false; openFull(); break;
    case 'full-close': closeFull(); break;
    case 'full-today': { const cur = $('#fcBody').querySelector(`[data-ym="${curYM()}"]`); if(cur) $('#fcBody').scrollTo({top:cur.offsetTop - 8, behavior:'smooth'}); break; }
    case 'h-first': openSheet(hSettingsForm(true)); break;
    case 'h-settings': openSheet(hSettingsForm(false)); break;
    case 'h-water': {
      const H = state.health, t = todayStr(), en = {...(H.days[t] || {})};
      en.water = Math.max(0, (en.water || 0) + (+el.dataset.d));
      if(!en.water) delete en.water;
      if(en.flow || hasLog(en)) H.days[t] = en; else delete H.days[t];
      save(); render();
      if(+el.dataset.d > 0 && en.water >= (H.waterGoal || 2250) && en.water - 250 < (H.waterGoal || 2250)) toast('Meta de água batida! 💧🎉');
      break; }
    case 'h-today': setFlow(todayStr(), 2); save(); render(); toast('Menstruação registrada 🩸'); break;
    case 'h-log': openSheet(hLogForm(el.dataset.date)); break;
    case 'h-day': {
      const ds = el.dataset.date, t = todayStr();
      if(ds > t){
        const mk = healthMarks(healthData())[ds];
        toast(mk === 'pred' ? 'Menstruação prevista 🩸' : mk === 'ovu' ? 'Ovulação prevista 🌸' : mk === 'fert' ? 'Período fértil previsto 🌸' : 'Esse dia ainda não chegou 🙂');
        break;
      }
      if(ui.hEdit === 'per'){ const cur = (state.health.days[ds] || {}).flow > 0; setFlow(ds, cur ? 0 : 2); save(); render(); }
      else if(ui.hEdit === 'sex'){
        const H = state.health, e2 = {...(H.days[ds] || {})};
        if(e2.sex) delete e2.sex; else e2.sex = 1;
        if(e2.flow || hasLog(e2)) H.days[ds] = e2; else delete H.days[ds];
        save(); render();
      }
      else openSheet(hLogForm(ds));
      break; }
  }
});
document.addEventListener('input', e => { const f = e.target.form; if(f && f.id === 'catForm') syncCatForm(f); });
document.addEventListener('change', e => {

document.addEventListener('change', e => {
  const f = e.target.form; if(!f) return;
  if(f.id === 'catForm') syncCatForm(f);
  if(f.id === 'appearForm' && e.target.name === 'mode') setTheme({mode: e.target.value});
});
document.addEventListener('submit', e => {
  const f = e.target;
  if(f.id === 'catForm'){
    e.preventDefault();
    const label = noHtml(f.elements.label.value).slice(0,24); if(!label) return;
    const data = cleanCat({id: f.dataset.cid || 'c' + uid(), label, emoji: firstGlyphs(f.elements.emoji.value) || '🏷️',
      color: (f.querySelector('input[name=color]:checked') || {}).value});
    const i = state.cats.findIndex(c => c.id === data.id);
    if(i >= 0) state.cats[i] = data; else state.cats.splice(Math.max(0, state.cats.length - 1), 0, data);  // "Outro" fica por último
    rebuildCats(); save(); render();
    if(ui.evDraft){ const d = {...ui.evDraft, cat:data.id}; ui.evDraft = null; openSheet(eventForm(d)); }
    else openSheet(catList());
    toast(i >= 0 ? 'Categoria atualizada' : 'Categoria criada 💚');
  }
  if(f.id === 'hLog'){
    e.preventDefault();
    const ds = f.dataset.date, vals = n => [...f.querySelectorAll(`input[name=${n}]:checked`)].map(x => x.value);
    const entry = {flow: +f.elements.flow.value || 0, sex: +f.elements.sex.value || 0, sym: vals('sym'), mood: vals('mood'), pill: vals('pill'), extra: vals('extra').filter(k => k !== 'agua'), water: Math.max(0, Math.min(10000, parseInt(f.elements.water.value, 10) || 0)), note: f.elements.note.value.trim()};
    Object.keys(entry).forEach(k => { if(!entry[k] || (Array.isArray(entry[k]) && !entry[k].length)) delete entry[k]; });
    if(Object.keys(entry).length) state.health.days[ds] = entry; else delete state.health.days[ds];
    save(); closeSheet(); render(); toast('Registrado 💗');
  }
  if(f.id === 'hSet'){
    e.preventDefault();
    const H = state.health, clamp = (v, a, b, d) => Math.min(b, Math.max(a, parseInt(v, 10) || d));
    H.cycleLen = clamp(f.elements.cycleLen.value, 20, 45, 28);
    H.periodLen = clamp(f.elements.periodLen.value, 2, 10, 5);
    if(f.elements.waterGoal){ const g = parseFloat(f.elements.waterGoal.value.replace(',', '.')); if(g >= 0.5 && g <= 6) H.waterGoal = Math.round(g * 1000); }
    if(f.dataset.first){
      const start = f.elements.start.value, t = todayStr(); if(!start) return;
      for(let i = 0; i < H.periodLen; i++){ const d = addDays(start, i); if(d <= t) setFlow(d, 2); }
      const d = parse(start); ui.cy = d.getFullYear(); ui.cm = d.getMonth();
    }
    save(); closeSheet(); render(); toast('Salvo 💗');
  }
});

/* ---------- saudação e mensagem do dia (horário de Brasília) ---------- */
function brNow(){
  try{
    const p = Object.fromEntries(new Intl.DateTimeFormat('en-CA', {timeZone:'America/Sao_Paulo', year:'numeric', month:'2-digit', day:'2-digit', hour:'2-digit', hourCycle:'h23'})
      .formatToParts(new Date()).map(x => [x.type, x.value]));
    return {hour:+p.hour, date:`${p.year}-${p.month}-${p.day}`};
  }catch(e){ const d = new Date(); return {hour:d.getHours(), date:ymd(d)}; }
}
function greeting(h){
  if(h >= 5 && h < 12) return 'Bom dia';
  if(h >= 12 && h < 18) return 'Boa tarde';
  return 'Boa noite';
}

const MSG_A = ['Oi, amor!','Ei, linda!','Oi, minha vida!','Oi, meu bem!','Ei, princesa!','Oi, minha linda!','Amor!','Oi, meu amor!','Ei, você!','Oi, gatinha!'];
const MSG_B = [

];
const MSG_C = ['Te amo! 💚','Te amo muito! 💚','Beijo grande! 😘','Te amo infinito. 💚','Sempre com você. 💚','Um beijo do seu amor. 😘','Te amo mais que tudo. 💚','Fica bem, tá? 💚'];
function dailyMessage(dateStr){
  // a mesma data sempre gera a mesma mensagem; muda a cada dia
  let s = 0; for(const ch of dateStr) s = (Math.imul(s, 31) + ch.charCodeAt(0)) | 0;
  const rnd = () => { s = (s + 0x6D2B79F5) | 0; let t = Math.imul(s ^ (s >>> 15), 1 | s); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  const pick = arr => arr[Math.floor(rnd() * arr.length)];
  return `${pick(MSG_A)} ${pick(MSG_B)} ${pick(MSG_C)}`;
}

/* ---------- namoro: começou em 11/12/2022; todo dia 11 é especial ---------- */
const START = {y:2022, m:12, d:11};
const MONTHLY_LINES = [
  'Obrigado por cada dia ao seu lado.',
  'Cada mês com você é melhor que o anterior.',
  'Que venham muitos e muitos meses juntos.',
  'Você é a melhor coisa que me aconteceu.',
  'Eu te escolho de novo, todo mês.',
  'Amo a nossa história.',
];
function togetherText(months){
  const y = Math.floor(months / 12), m = months % 12, parts = [];
  if(y) parts.push(`${y} ano${y>1?'s':''}`);
  if(m) parts.push(`${m} ${m>1?'meses':'mês'}`);
  return parts.join(' e ');
}
function specialDay(dateStr){
  const [y, m, d] = dateStr.split('-').map(Number);
  if(d !== START.d) return null;
  const months = (y - START.y) * 12 + (m - START.m);
  if(months <= 0) return null;
  const line = MONTHLY_LINES[months % MONTHLY_LINES.length];
  if(months % 12 === 0) return {
    big: true,
    title: `Feliz ${months/12} ano${months>12?'s':''} de namoro! 🎉`,
    text: `Hoje fazemos ${togetherText(months)} juntos, meu amor. Obrigado por cada dia, cada risada e cada momento. Te amo infinito. 💚`,
  };
  return {
    title: 'Feliz mêsversário, amor! 💚',
    text: `Hoje fazemos ${togetherText(months)} de namoro. ${line} Te amo!`,
  };
}

}
